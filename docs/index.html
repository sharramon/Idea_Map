lationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_010__technology","source":"entry_010","target":"technology","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_010__systemic_critique","source":"entry_010","target":"systemic_critique","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_010__meta_understanding","source":"entry_010","target":"meta_understanding","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_011__culture","source":"entry_011","target":"culture","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_011__meta_game","source":"entry_011","target":"meta_game","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_011__society_building","source":"entry_011","target":"society_building","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_012__loneliness","source":"entry_012","target":"loneliness","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_012__trust","source":"entry_012","target":"trust","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_014__emotional_renewal","source":"entry_014","target":"emotional_renewal","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_014__existential_questioning","source":"entry_014","target":"existential_questioning","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_014__time","source":"entry_014","target":"time","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_015__emotional_renewal","source":"entry_015","target":"emotional_renewal","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_015__existential_questioning","source":"entry_015","target":"existential_questioning","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_015__self_discovery","source":"entry_015","target":"self_discovery","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_016__self_discovery","source":"entry_016","target":"self_discovery","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_016__motivation","source":"entry_016","target":"motivation","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_013__self_discovery","source":"entry_013","target":"self_discovery","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_013__existential_questioning","source":"entry_013","target":"existential_questioning","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_013__time","source":"entry_013","target":"time","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_013__growth_mindset","source":"entry_013","target":"growth_mindset","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_017__trust","source":"entry_017","target":"trust","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_017__vulnerability","source":"entry_017","target":"vulnerability","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_017__fear_of_rejection","source":"entry_017","target":"fear_of_rejection","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_017__disillusionment","source":"entry_017","target":"disillusionment","relationship":"tagged","explanation":"","confidence":0.75}],"themes":[{"id":"career","name":"Career & Professional Growth","description":"Work, ambition, skill-building, professional identity"},{"id":"identity","name":"Identity & Self-Understanding","description":"Who I am, self-image, authenticity, personal growth"},{"id":"relationships","name":"Relationships & Connection","description":"Friendships, trust, communication, belonging"},{"id":"creativity","name":"Creativity & Expression","description":"Making things, artistic impulses, creative process"},{"id":"learning","name":"Learning & Curiosity","description":"Intellectual curiosity, reading, mental models, expertise"},{"id":"health","name":"Health & Energy","description":"Physical and mental wellbeing, habits, energy management"},{"id":"values","name":"Values & Meaning","description":"What matters, ethics, purpose, integrity"},{"id":"goals","name":"Plans & Goals","description":"Future vision, planning, motivation, progress tracking"},{"id":"emotions","name":"Emotions & Inner Life","description":"Feelings, moods, internal experiences, emotional patterns"},{"id":"philosophy","name":"Philosophy & Big Questions","description":"Meaning, consciousness, existence, how the world works"},{"id":"projects","name":"Projects & Making","description":"Specific things being built, iterated on, shipped"},{"id":"observations","name":"Observations & World","description":"Noticing things in culture, society, technology, nature"}],"themeClusters":[{"id":"identity","name":"Identity & Self-Understanding"},{"id":"relationships","name":"Relationships & Connection"},{"id":"creativity","name":"Creativity & Expression"},{"id":"emotions","name":"Emotions & Inner Life"},{"id":"philosophy","name":"Philosophy & Big Questions"},{"id":"observations","name":"Observations & World"}],"sources":{"source_001":{"id":"source_001","title":"2017-04-06","created_at":"2026-06-14","raw_text":"04/06/2017\r\nWhat are you not\r\n \r\n\tI’m a little teapot short and stout. I’m also not very honest. Note here that I have avoided the Epimenides paradox by not claiming that I always lie. Everybody lies, as much as everybody dies. I think that the ninth commandment was poorly thought out, like rules parents make for their first child- well meant, but without any thought to realism. Either that or God really didn’t want real estate prices in heaven going up. Being priced out of heaven by humans would be too much of a hilarious straight shooting comedy for Jesus after all.\r\n\tBut even in this sad cesspool of sin, something my Catholic school assured me the earth is, I’m particularly bad at observing this particular commandment. Lying comes a little too naturally to me. I’m not sure why. If I had to guess though, I would say that I’m afraid. In fact, I think the main, or perhaps only reason people lie is because they’re afraid. Afraid of rejection, of being found out for the fraud that they think they are, afraid of reality. So according to transitive properties I must lie more than everyone else because I’m more afraid than everyone else.\r\n\tNow that took a rather dark turn. But hey, I could be lying. Because what could I possibly be so afraid of? Why should I be more afraid than everyone else? It seems rather presumptuous to say that I’m more afraid. After all the mortality rate of my peer group should be orders of magnitude lower than that of people in Israel, or the middle-eastern countries seemingly constantly at war against … democracy(?), I think is what the media tells me. My mortality rate is so low that I know stupid facts like that eating one-thousand bananas will increase my mortality rate by 1 micromort, meaning that the probability of my death goes up by one millionth. This is rather impressive. I will soon look into buying one thousand bananas. These challenges are really what makes me feel alive. Thrilling.\r\n\tMaybe I’m afraid of being dropped, of people finding out that I’m some sort of failure and deciding that I’m not worth their time. So perhaps I’m not very confident. This seems to feel like it has some inkling of truth. Like many deep seated traumas, this one could even be rooted in my childhood. Those moments when I returned home with a bad grade and had to then endure hours of being shouted at, or saying that I wanted to be an artist and having my drawings be mocked. At the very least, modern outlooks on parenting trends seem to agree with me. Look at that, by asking what I’m not, I have seem to started to answer what I am. Well, let’s not dwell in this place too much. The pained confusion of why I’m not confident is much more enjoyable to read than me moaning about why I am unconfident; a rather drab and common topic on internet forums.\r\n\tI’m not honest, but I try my best to be genuine. Oddly, I have come to realize more and more that those who live life to the fullest seem to make a habit of being honest. So I don’t think I can live a genuine life without living an honest life. Being afraid of reality and rejection would mean that I can only run and stuff my head in the sand- an idiom that has its roots in ostrich behavior by the way. \r\n\tBut I’m pretty sure I’m not an ostrich.\r\nI think I like this answer to this prompt.\r\nI am not an ostrich.\r\n"},"source_002":{"id":"source_002","title":"2017-04-14","created_at":"2026-06-14","raw_text":"04/14/2017\r\nWhat happened on that Day?\r\n\r\n\tIt was daytime. It was a warm daytime with sunlight streaming in through glass doors that led out to the balcony and a brilliant Californian day. The fan beat overhead, almost silent, attempting to chase the heat away. I held a heavy book in my hands. It dealt with patricide and Russia, with faith and cynicism, jealousy and honor; my world. It was the world that I had always tried to understand a little more of using the conflicting nature of people shown to us through ageless classics.\r\n\tBut it was such a nice day outside. I had long forgotten how nice a warm day feels, what it was like to smile only because the sky was blue. The catalyst for this change was a few feet away tapping away at a keyboard, frowning at some probability problem that had to do with efficiently finding the maximum using some kind of random walk. Interesting, terribly complicated, and, according to her, a very fun problem to think about.\r\n\tMy mind drifted from the book to a conversation we had had yesterday. I wanted things to change, and I wanted somehow to change them. She replied that I was obviously miserable, that I was missing the entire point of being alive. I retorted with a bible parable, her with a story about seagulls. ‘I want to help’ was my stance. ‘But you aren’t free’ was her reply. Maybe that’s why I like reading Dostoevsky, I thought, because his characters seemed caged, angry.\r\nI shifted on the couch, curling into a more comfortable position. The sun sinking into evening… tempting me to close my eyes. My mind was hopelessly scattered now. We had talked about empathy and sympathy. To understand one person IS to sympathize with them! Was her declaration against my point that these were different. I explained that to understand doesn’t mean that you sympathize, because sympathy seems to imply some form of compassion. Yet we can hate ourselves, showing that even in extreme instances of empathy there can be a plausible absence of sympathy. Yes, okay, but why do you care? Because I want to know how we can properly sympathize with each other.  But why?! Because then no one would have to feel hopelessly isolated. Again her signature frown- she was thinking about it. It interested her. A compliment.\r\n\r\nMy mind kept wandering, always into the same person.\r\n\r\nShe was the most straightforward person that I had ever met.\r\n\r\nIt’s so easy to be healthy! You just have to know that you want it and then just do it! Was her take on exercise. ‘But what if I feel lazy?’ I ventured. Then you ARE lazy. It was a merciless response, but fair enough. I started jogging. There was also a laughably convoluted conversation about how cutting carbs would free me from being dictated by hunger, and enable me to pursue what trains of thought I’d want. So of course, I started eating salads. \r\n\r\nI wanted to know what living this straightforward life was like.\r\n\r\n\tI had been closing a chapter in my life. One written by wanting to be myself in a world that seemed perversely interested in finding ways to kick me down. Such a life, I realized, was defined by staying standing despite everything crushing you, which meant being defined by resilience and a lurking anger. When everything belittles you, anger can keep you up. Anger, idealism, or indifference. But I wasn’t being attacked any more. All my coping mechanisms were doing nothing, all my walls and mirrors protecting me from threats now only imagined, hemming me in. I felt empty, hopelessly weighed down by all these self-made structures that no one could understand. The driving force of anger had burned to nothing, leaving me cold. Why was I here? Who was to blame? I hated it all.\r\n\tWell if you don’t like it so much you don’t have to be alive you know! Just get a knife or something and ask if you really want to live, and you do, of course you do! Because you’re alive right?! A challenge that hung in the air, her outburst a little too passionate for the talk we were having. I gave an awkward smile, remembering. A knife, me. No cuts, no dramatic gestures, no plea for attention. Just me, a knife, and a question. The question. I had felt tired, so tired. I said so, her expression softened. We were both talking from experience.\r\n \tWe’re here because we want to be. She started. So stop being so damn miserable? I finished. She smiled. Yes. Exactly.\r\n\r\n“Arrrgh.”\r\nA frustrated grumble took me out of my dozy memories. I looked over at the small hunched figure with her head in her hands.\r\n“Having trouble?”\r\n“Yes, I’m sure I can figure it out. I just need time to... How’s your book?”\r\n“Interesting, just read a chapter called ‘The Inquisitor’. It’s about how… well… it’s complicated.”\r\n“Tell me.”\r\nI ambled over to the table, collecting my thoughts. Long shadows sprawled across the living room floor, the sun flaring orange for the final hour before it set. She was here for a few more days, then we’ll never see each other again. That was fine. I would miss her, but that was fine as well. We would trade presents, and say our goodbyes, and that was how life flowed by, how people passed by. But today I looked out at a beautiful day and appreciated the sun’s warmth, looked up into a clear sky and smiled at its clarity. It had been a fine day.\r\n"},"source_003":{"id":"source_003","title":"2017-04-21","created_at":"2026-06-14","raw_text":"Why bother?\r\n\r\n\tAh, hello old friend. I hope it’s fair to call a question a friend, since friendship is really only a matter of intimacy. I wonder if there has been a single day in the past decade where you have not taken up at least some corner of my thoughts. Such an incessant friend, so needy, and unrelenting. We’ve been down many paths trying to satiate your need to be answered, your need to be truly understood and satisfied. As is the case with old friends, I feel that I’ve perhaps adopted too many of your mannerisms and your mode of thinking. I’ve spent entire days pondering what you mean. I’ve even let you creep into conversations with my other friends, and the need for an answer grows only stronger with every failure.\r\n\tI first really made an acquaintance in the very early years. You make yourself known best when there is something making me do things I do not want to: when there are tests I don’t care about, when I have to perform actions I have no real investment in, and when I find effort to be just too much at certain points in time. So I would get to know you through the times when I was in my room, trying to live the dreams of other people, making myself act stronger than I felt.\r\n\tAs I grew older I’ve found that you have a lot of friends, lots of people you bothered with your presence. One frenchman even said “There is only one really serious philosophical question, and that is suicide.” Boy you really drove that man up the wall. Remember that time when I thought that life was about what you can leave behind? About the people who will pick up your dreams and keep whatever fire you lit burning towards the ends of eternity? I really did read too much fantasy back in the day. There was also a short stint where I thought life was about being nice to other people and trying to understand them. That was really the bible talking, but it really helped me question morality in interesting ways later down the line. So I guess I salvaged something out of that mess. I had a stage where I thought life was about hope, and about breaking apart everything to grab only whatever happiness I could. I think I was sad then, and your constant questioning of my life choices made me selfish and very angry. It didn’t help that around about this time we thought that life might be about trying to help the people we care about. Figuring out that those same people can hurt you in ways we thought I was already guarded against wasn’t much fun, especially when it happened a few more times. Well, fool me twice I guess.\r\n"},"source_004":{"id":"source_004","title":"2014-04-21","created_at":"2026-06-14","raw_text":"Myself and the world\r\n\r\nThe idea exists to be expressed. The thought is the why and what of what we do.\r\n\r\nIt's an odd way to start off a concept, but I mean that the existence of ideas means the existence of the person. The person is defined by what they think and why they think it. Negatives, positives, empathy, cruelty, faith, disbelief; they're all rooted in thought.\r\n\r\nAs an extension of this thought, it would be fair to think that the idea is the world. The world is defined by what we think regardless of how the world itself is arranged. The world is indifferent, we just shape it to be cruel or kind. Mind over matter.\r\n\r\nThe thought leads onto the very basic concept that everyone lives in their own world, completely different from the world of others. Every mind is a world for the world is in the eyes of the beholder.\r\n\r\nDoesn't this worry you sometimes? What if that one person you thought was nice to you actually just thought nothing of you? What if those who you thought were significant in your life held you in no significance at all?\r\nAlso, on brighter notes, what if people you just passed by everyday perceived so much more beauty in the everyday than you ever did. It could very well be that the stony faced person whom you ridiculed for being one of the herd actually ponders questions that would befuddle you even with the very basic openings of its argument.\r\n\r\nThe world is acting on you, but at the same time you are acting on the world. You cannot simply be a victim to any whim of fate. A victim of fate is one who resolutely chooses to fall, not one who accepts the fall.\r\nThe fall itself is avoidable, but will most probably come with a life of mere existence.\r\n\r\nThe master of the world is you. To complain has no meaning in such a world. To believe is to make possible. To act is everything. Boldness is magic.\r\n"},"source_005":{"id":"source_005","title":"2014-04-22","created_at":"2026-06-14","raw_text":"Myself and you\r\n\r\nAnd hello stranger! Here is myself, and there is yourself. Who am I? And who are you? I would much like to tell you who I am, and I would much like to hear who you are.\r\n\r\nBut how limited our means to do this. All language and art can't cover our whole existence. For my thoughts create a world, and your thoughts your world.\r\nHow can we express a world of thoughts with words so untrained? Or with drawings so unpolished? Even with mastery, perhaps I would be able to show you just one instant of thought that I hold precious. If I ever do I only hope that you too will hold this moment precious.\r\n\r\nTo say that a world exists in one's mind sounds marvelous! Doesn't it quite? To say that 'I'm special because I hold my own world'. But how sad is it at the same time to hold a whole world to yourself. Is it not depressing to think that I live in such isolation from you, and you from me? I'm afraid that my world is rather queer and alien. I hope it does not dissuade you from knowing me.\r\n\r\nFor I want to be known. I do so very want to be seen. I do so very want to see. What lies past that smiling face that you always put on and what thoughts beyond the 'how are you's and 'I'm doing great thank you!'\r\n\r\nBecause without this the world is a world of worlds. And in so many worlds one little thought does get rather lonely. Are you not lonely too? So unsure and ill-placed?\r\n"},"source_006":{"id":"source_006","title":"2014-04-23","created_at":"2026-06-14","raw_text":"Myself and I\r\n\r\nIdentity, the greatest lie of all. How can I see me from outside myself, when trying to get out leads me back to myself. To try and look at yourself is trying to escape the mobius strip by walking along it. Identity is an infinite trap.\r\nI know myself better than I know anybody, and the infinite alleys and curtains that branch and veil. I am afraid of the dark paths, that is why I have drawn curtains over them.\r\n\r\nYet who but I can call myself by my own highest name? Who else can tread along these winding roads that split and crack and still comfortably call it home?\r\n\r\nThere are temples here, some broken down, some almost forgotten, all once revered. There are books and books and books strewn about.. on life, on love, on happiness. Scraps of paper desperately torn out after being scribbled on. They were all in search of an answer to a question I don’t know how to say.\r\n\r\nI love and hate myself, as I love and hate this world.\r\nThis world so full of pain and wonder. Where the glimmering light sometimes refracts into ten thousand thousand shards of light in an instant of purest understanding. This place where it always feels like the tide is rising and I will always drown.\r\n\r\nWhen I act I act upon the world, when the world acts it acts upon me. But here is where I am both world and myself. The quiet tides of this place are tides I have made, the storms, storms I have accepted.\r\n\r\nHere I am. Here I always will be.\r\n"},"source_007":{"id":"source_007","title":"2018-07-03","created_at":"2026-06-14","raw_text":"What do I want?\r\n\r\n\tWhat do I want? Well ultimately, I think I want what we all want. I want to be happy. But this is no answer at all.  Perhaps I should move onto a more personal account of happiness. I think that the man who both works at something he believes in and has his work understood is closer to happiness. \r\nThis is still too abstract. Maybe an example might help. \r\n\r\nImagine a time before art where a person stumbled upon a brick, a crumbling brick in the morning sun surrounded by some slight mold and grass in some corner of the garden. They decided this moment, the most important moment in their life and started about capturing it. But there is no art, bricks were drawn as wonky squares.\r\nThis seemed good enough. But this person found that straighter lines would make it seems a little more regular and ‘brick-like’. Which seemed understandable to other people. There is something inherently satisfying about good right angles and clean lines.\r\nBut then the person finds this deeply unsatisfying and happens upon that fact that two elongated rectangles on the side makes it seem more… three dimensional somehow.\r\nNow this guy is a nutjob. While what he found may seem true to some people he cares about bricks way too much. But there is more. They find out about shading, then about how there seems to be a line of light on the edge of the darkest edges (as light does ‘bend’ around corners, but how were they to know?). How it is wrong to even draw the outline and to let the colors dictate where a shape starts and ends. One day as he is doing this someone will stop him and say ‘that’s not quite how a brick looks’. It is in this moment that the gap has been closed. Others can now see parts of what the person was trying to create. Their dream, while maybe not quite realized, can finally be shared. One day they might get to show the tranquility of the rough red brick, slightly worn, that was surrounded by soft hues of green and splashed with color from the butterflies and flowers. There is something attractive in this idea. To be able to work on what one loves and finally have people see what is it that one loves about it. \r\n\tNaturally then, the next piece of writing will be the question ‘what is it that I love?’. \r\n"},"source_008":{"id":"source_008","title":"2021-02-02","created_at":"2026-06-14","raw_text":"Society is constructed. No, that isn’t quite true, as it implied that there is a maniacal, malevolent mind trying to build society brick-by-brick. What I mean to say is that society is a construction.\r\n\tBy a construction I mean to say that it carries two important qualities: it is artificial, and it is malleable. Society, being artificial, has no hard and fast truths; no absolute values. So all our morals, justice, and freedoms are all just constructs built on abstract nothings. So all of society is malleable, and nothing that is has to be that way. We can change it.\r\n\tIn the Western consciousness, the Age of Enlightenment and subsequent existentialist philosophies stand as examples of what can be achieved when we realize the shortcomings of the current social narrative on a mass scale. Within a century we distanced ourselves from the monarchies that had been the ruling institutions for the past few millennia, and had created narratives around personal freedoms, rights, and happiness. It is on these ideals that the French Revolution, the Napoleonic wars, and the American Revolution happened. The driving humanist forces behind these movements eventually eroded Christianity, with Nietzsche declaring that “God is dead … and we have killed him”.\r\nNow these themes of truth in science and the general meaningless of life have become the new status quo. But where are we now? The progress of science and economy has brought us this far and helped us get away from religious doctrine and feudalistic societies. But now the themes of the day are a loss of solid moralities, near kafkaesque nightmares of bureaucracy, and marketization of our own attention. We are not the Ubermen that Nietzsche dreamed of, nothing like the absurd heroes of Camus, or the humanists living in good faith that Sartre wanted. We’ve replaced religion with beliefs in science, nationalism, or political parties. Economy has given us scale that can be seen in the aggressive expansion of the village into the metropolis, and the village store, became the national franchise, became the global mega Corp. The everyday man is placed further and further away from any kind of impact or power. All of the promise of democracy is abstracted away to a vote or two every few years backed with rhetoric and little else, with no clear way of seeing how anything impacts anything. Layers and layers of interests create localized mists that block one from seeing anything clearly past a few steps, creating middle management in everything, resulting in more paperwork, more confusion, more drudgery. What’s worse is that it’s not some mastermind villain with an overarching plan that’s doing this to us - it’s just shortsightedness. What seems to make sense in the short term keeps screwing us over in the long term. The built-in apathy towards a system that seems too big to change doesn’t help either.\r\n The internet came with the promise of a united world with ties to everything, and while it’s done massive good by giving people access to everything, it also gave access to us. Our attention is grabbed and marketed to, everything is a Skinner box that’s designed to induce a limbo-like passivity between our frantic hours of work. The marketing to our tastes divides us more than ever, with so much info spewing out that our overactive brains can make any pattern out of the chaos, and this pattern informs the machines, which then feed us more info to reinforce comfortable patterns. Challenging us creates disruption in user engagement, it’s just easier to keep feeding us the beliefs we already hold.\r\nThe above is now becoming pretty obvious, and it’s receiving attention right now. But as with all games, the trick is to play the meta-game. The real problem isn’t that we need single page, easy-to-read tax forms, or that we need to regulate the way the internet hijacks our dopamine seeking brains. The problem is that we need to figure out how to see and interact with the systems that make up our world. Even the world of startups, heralded as the bastion of disruption and innovation, run into these same problems as most of the problems they’re trying to solve these days are just optimization and automation problems. It seems to be mostly fintech, automated delivery, better rental services, etc despite their claims to massive disruption. (So what are we supposed to do? Purchase stocks as we get our food delivered to us in our airbnb to utopia? Like Jesus startups, get your shit together. This is at best zero to point-oh-one). But this is just a symptom of the problem I’m trying to point to. In a world where you can’t see everything, the best most people will try to do is optimize their immediate surroundings to a local maximum. \r\nWhat do I mean by meta-game? Well let’s take a brief look at the reality that we live in. We live in a supposed meritocratic capitalist society. None of this is a potshot at meritocracy or capitalism, in fact I’m a big fan. But the ‘supposed’ in supposed meritocratic society comes in when we start measuring for specific performance metrics such as rote memorization, the ability to write to a rubric, or quickly finding mathematical solutions. These are supposedly merits in some sense, but for what? Why? How? We don’t quite know, but we stick numbers to them, and then the massive rat race begins to optimize to maximize these numbers. Capitalism is just this but bigger. Money was supposed to be a tool to help us live, all it was was just a way for us to carry around goods. Unfortunately, money is inherently countable and can be optimized for. So all hell broke loose bit-by-bit until somehow we’ve ended up at a society that trades money backed on nothing but trust in the country’s institution worth as much or as little as our faith in God. A belief that’s recently being shown on full display in the crypto craze. It’s a system where human lives are just another number on the balance sheet of insurance companies in a crazy bid for the richest, who definitely can’t need more money more than people need their lives, to get the highest returns so that they can watch the numbers on their scoreboard go up. This is part of the meta-game. If we introduce a number and tie it to power, people will try to optimize for this, even to the point of absurdity.\r\nBut to even play the meta-game properly we need to get the data and then the means to create an abstracted, simplified view of all of society in a way that we can run it through our pattern finding brains. One would be inclined to tell me this is impossible. But isn’t this precisely what education is? The fact that a load of people understand basic human history, basic economics, mathematics, literature, and more is nothing short of a miracle from this ‘can’t do’ angle. The only problem is that we don’t know what the data for this abstracted worldview is. But this is only part of the problem. If we solve the world today that’s just playing a form of the startup industries of trying to solve the local problem. This isn’t the full meta-game.\r\nThe full meta-game comes in when we go into society building. In the creation of societies there are moves that we can make, the creation of cultural heroes and villains, a central narrative, celebrations. America is the ‘city upon a hill’ and ‘the land of the free, home of the brave’ these are myths that identify America. The victory against the British and then the Nazis formed the backbone of the ideas of American justice and freedom for the individual. We celebrate Martin Luther King as a paragon of equality and look to George Washington as the picture of American decency with his apparent inability to even lie. We’ve put capitalism on a pedestal and our tellings of the Cold War with the Soviet Union and their apparently ‘evil’ communism to the point that the word itself feels like it has negative connotations somehow where once the idea itself meant salvation to near slave classes in Europe. Society and its beliefs have building blocks. But why is it important to learn this? Why not just stick to solving our own society? What good is this meta-game?\r\nIn a now-famous commencement speech David Foster Wallace tells this small ditty.\r\n\r\n“There are these two young fish swimming along and they happen to meet an older fish swimming the other way, who nods at them and says “Morning, boys. How’s the water?” And the two young fish swim on for a bit, and then eventually one of them looks over at the other and goes “What the hell is water?””\r\n\r\nThis short parable is supposed to show you how hard it is to even see the most important things around you when it has become part of your everyday life, ingrained in your reality and identity. Could you imagine telling a priest of the Spanish Inquisition that maybe killing heretics was a rather ridiculous notion on the grounds that God didn’t exist? God was an absolute to them. Or perhaps to bring it home, that the concept of nations is a rather ridiculous and sub-optimal building block to base your identity around, as this idea of nationalism was started in a big way around the 18th century by those in power in order to indoctrinate you to stay loyal after the whole Enlightenment made it infeasible to smack you with the good-ol divine right of Kings to rule over their people given by God? That this idea was a perfect idea to then brainwash its citizens to their right to glory and start two of the most devastating wars in human history? These are brilliant moves on the part of culture creators, so brilliant that we can no longer even see them as moves and accept them as truths. If we don’t play the meta-game we get stuck again at another local maximum, and then human effort is back again to solving local optimization problems.\r\nAnother reason that it’s important to learn the meta-game is simply the fact that if one wants to learn how to impact society, one must know the moves and rules. To paraphrase Wittgenstein, one must know the general rules of chess to meaningfully ask what a ‘king piece’ is. So we must try our hand at this society building over and over and over again in order to understand exactly what it is that’s being done, to learn the rules and the pieces. This is where the linear approximations of realities really shines.\r\nWhile these are the big moves, we run into another problem. Because we’re creating approximations they run the risk of losing too much important information on the way there. The systems are trying to be objective about life, but this is in itself an impossibility. In The View From Nowhere Nagel points out that trying to achieve any type of objectivity is a kind of paradox. This is because all experience is personal and subjective. Any attempt at a more objective experience is ultimately just a shot at a larger subjective experience. In a similar vein, even with all the objective truth in the world it’s impossible to deny the individual. It would be disingenuous to ask that one forgo one’s interests for some kind of greater good constantly. \r\nLife has to be lived. This is what Nagel meant when he said that all experience is subjective. Experience can only be self-centered. Similar ideas are encountered in fields such as enactivism where experience itself is said to be embodied, and so having a body is vital to how we experience the world. Nagel has even said that “our own experience provides the basic material for our imagination” in his extremely famous paper What is it like to be a bat?. In the study of language Wittgenstein talks about how language is limited because communicating is like trying to talk about an insect in a box without showing the insect. Even worse, agreeing on what an insect is requires two people doing this at the same time until they just kind of come to an agreement that their ideas seem similar enough. Yet what if this agreement was impossible? What if I had something in my box that you simply didn't? Wittgenstein has an animal thought of his own here where he says “If a lion could talk, we would not understand him”. In short, with such disparate states, we could not even imagine the basic truths that build the ground of these experiences. Since we’re trying to understand people, we won’t run into something as extreme as trying to embody the experience of an echolocating bat or a talking lion. However, trying to understand people from other countries, or socio-economic classes, or even just different jobs has a lot of barriers. Trying to figure out how to efficiently absorb the information from these different experiences will do a lot to increase the basic material for our imagination.\r\nIn Andy Weir’s The Egg, the protagonist finds himself in the afterlife talking to a type of god. They find out not only that reincarnation is real, but also that all life in the universe is just him reincarnated over and over again. The reason being that he is being trained for godhood himself. This multitude of human lives is what would be our ultimate goal. It would be the attempt to try to create a type of human singularity with the hope that we could transcend such short-sightedness to create near god-like humans where the abstract problems would become personal ones. Simply, what we think as the limits of our attempts at objectivity would just become the subjective to this being while missing none of the detail. A person who has experienced their own hunger wants food, a person who has experienced a million hungers paired with a million gourmet meals would see the disparity (or so the hope goes). While I have said that it would be disingenuous to ask the individual to forgo one’s own interests for the greater good, here we are hoping that our human singularity would feel the greater good to be their own interest, to feel the big picture personally. For isn’t this what a god is?\r\nIt is oddly also a great place to start the whole process. As it’s hard to care about models of reality, but living a life that’s radically different from our own would give us the right tools to ‘see the water’. Everything follows from this. The personalization of a multitude of lives by having lived them, and the ability to iterate through different versions of social structures would give us reason and means to try and approach our reality as something that is both something that can be understood and changed. This is the perfect picture. The question is then, where do we start?\r\nI think we start at the bottom, from the experiences. We must cultivate a generation of people who have true varied perspectives, as this is what drives the need for the rest of the picture. The most dangerous lie is that good is absolute, and that good will find its way to the top somehow. There is no good, only cultivated values. We already have enough food to feed everyone, and the means to house everyone. We have the means to generate and analyze way too much data, and we can go anywhere, talk to anyone. The physical world has been pushed far enough that many of our problems shouldn’t exist, and this is thanks to the age of enlightenment, science, and economy speeding forward with material progress. Now we are by far the weakest link, unable to deal with the complexity of the world we have created. We have everything we need to create a feasible utopia. Now it’s just a problem of having to better ourselves.\r\n"},"source_009":{"id":"source_009","title":"2011-12-02","created_at":"2026-06-15","raw_text":"Those who know loneliness are the ones who will understand what it means to be lonely. The ones who reach out to help others are the ones who know pain. Perhaps humans are limited in their understanding to see beyond their own experiences; but the fact that they seek to comfort those who are going through the same hardships as they have…. Perhaps that’s where we can see hope.\r\nHope for mankind.\r\n"},"source_011":{"id":"source_011","title":"2018-04-16","created_at":"2026-06-15","raw_text":"04/16/2018\r\n\r\n\tI dislike how my days are going. I’m letting them flow past me without much care. Everyday used to mean so much more to me. It seems to have something to do with attention and want. When one wants something you measure the time pass by one tick at a time, clinging to any sign that the last second, the last minute had left some mark on your mind. Then one gets to the worrisome business of measuring the time left, thinking that maybe if the last minute had left this much then the next minute should leave a little bit more. But when indifference settles, it settles like dust. Filling the grooves of effort painfully etched with the minutes, dulling their edges, softening their corners, until what industry was in the air is now just a shimmer of a million dust particles that swirl in the sunlight. All is slow and time quite immeasurable so that the seconds fade into minutes, and the minutes somehow to days. At first it seems like rest from all the wearisome measuring, but one soon realizes- It is decay.\r\n\tSo then what does it mean to want for something? Is it the restless nights that just seem to happen as you grind yourself down in the search of a goal? Our ideas about progress seems to have influenced how we conceive ourselves in time. Definitely, my readings of existentialism influenced how I see myself in relations to ideas such as fate. There is no divinity that guides my hand, and so I am utterly alone. Once I understand this, then I am responsible for all my actions. This is what I’ve always thought. But to be responsible does not mean that I am the sole arbiter of the world, it only means that I can only do what I can. So then it becomes a problem of what I want. How does a person ever know what they want?\r\n\tThere must be a difference between saying ‘I should do something’ and ‘I will do something’.\r\n\tHowever, I can’t keep saying ‘after I do this one thing I’ll live my life’, my life is now, and all of the time I’ll ever receive is already going by, ceaselessly, until I die. Life is now. Life is here. So then what am I doing with all of this life that I’ve gotten? Is it what I want? I don’t think so.\r\n\tI will delve deeper into the things I care about: neuroscience, virtual reality, and empathy. I need to constantly hold myself accountable to live within these lines. I am just like all other people, there is nothing special about me. So I must make myself chase the things I want. Write about it, read about it, work on it, meet people who are in it. There are ceaseless opinions and essays on these very topics that I profess myself to be enraptured by. There is no excuse for laziness.\r\n"},"source_012":{"id":"source_012","title":"2020-01-12","created_at":"2026-06-15","raw_text":"I sat there, staring at the screen, a million little puzzles filling my head. I had to figure out why my http post request was sending out errors, I had to figure out how to order downloads over a network, and I had to look at what was causing tracking errors with my virtual reality headset. It was all on a list, and I had set deadlines for myself. All of it was so… dry. The only real obstacles in my path were time, my own fear of failure, and the allure of a thousand distractions.\r\n\r\nWhat is a dream?\r\n\r\nMy mind suddenly prompted. It was doing that a lot these days, like a small flashing signal in the back of mind warning me that there was some urgent existential oil change that needed attending to; that my mind was slowly turning into sludge from the accumulation of the everyday annoyances and vapid thoughts that were filtered through.\r\n\r\nI felt the stillness of the room again. The books on the bookshelves felt like a little bibliography of my life, gently reminding me of the times I had read them, the cracks along their spines creeping proof of the sleepiness nights that a smaller me had spent escaping to other worlds, knowing with a certainty that only innocence can give that everything was possible.\r\nI press my fingers against my eyes. It sometimes feels like the reward for having a dream is doubt and poor sleep. I feel the old arguments rise, slowly swirling in the background noise of my mind. Nietzche’s eternal recurrence, Sartre’s good faith, Camus’ absurd hero - defense mechanisms that I painstakingly put in place in my early twenties to ensure that I wouldn’t give up on the ideals of my late teens, almost chaining me in place.\r\n\r\nRemember the injustice. Remember the guy who got hooked on drugs after everyone abandoned him and telling you about his wonderful acid trip on a bike. Remember the girl who burned all her furniture. Remember the small town girl confiding in a panic to you over a keyboard about her abusive boyfriend. Remember th-\r\n\r\nFuck.\r\nWhat the hell am I doing.\r\n\r\nYou’re creating a virtual reality experience that forms a useful tool in the context of the metaverse that allows real time downloading of 3D model using a game engine from the web which-\r\n\r\nShut up.\r\n\r\nAnd this is tied to your long term goal of a user created world based on use and meaning as it frees even the least artistic to create a space like a sandbox to express their inner-\r\n\r\nShut up!\r\n\r\nAll practiced pitches. Weak pitches. Backed by hope and no figures. There’s another voice in the back of my head echoing the Pareto principle, (only 20 percent of effort is required to get 80 percent of the way there), that I’m missing something and that I should figure out what moves the needle so that I can better use my time. That I should know what the needle is by now. That I’m too slow and that I should be better at big picture thinking. That execution is everything.\r\n\r\nMy mind brutally beats my thoughts into submission, telling it that there’s no real choice but to sit down and finish at least this small project that I’ve set for myself.\r\nI remember my journal entries for the last few years, demanding action, constructing this weird prison around myself to try and leave me no choice but to keep acting, giving myself no choice in the matter. Some random snippet of something I read years ago flits across my mind, asking me how one can have self discipline if one is beating oneself into submission. Then am I the master or the slave? And how have I done so little?\r\n\r\nI dislike thinking. Because I know all the answers that my mind will give me already. I sigh and open my phone, scrolling through conversations, distractions. I haven’t been engaged in a long time. Not when I’m coding, not when I’m talking, not when I’m reading. My entire life feels like it’s being lived through a haze of introspection, my constantly scanning mind somehow blurring the thing that is my life.\r\n\r\n'But you seem so miserable'\r\n\r\nGinny. Or my memory of Ginny. An idealized girl that existed nowhere but in my mind for two warm sunny weeks in Wintertime California.\r\n\r\n'How will you help people when you yourself are so miserable?'\r\n\r\n401 error, authorization. I'm pretty sure I put in the write authorization information, but I know so little that that feeling is worth its weight in thought. I start googling.\r\nBut I'm not miserable. I think?\r\n"},"source_010":{"id":"source_010","title":"2018-05-03","created_at":"2026-06-15","raw_text":"Dear Megan,\r\n\tIt’s almost been a year. I think it’s odd that we mark the passage of time so much when time itself seems like a continuous concept that keeps flowing on. It feels a little like seeing a river and trying to put marks in the water. But maybe we do this because time feels like it’s tied to our sense of self, as time is tied to our ideas of change. Identity is a tricky thing to define, and so we look at makers- the days, the weeks, the years- in an attempt to grasp at what feels ungraspable.\r\n\tI hold little belief in the illusion that you would care about me at all. There are undercurrents of my past in this belief, as people seem to have a knack of not caring about me. But that itself is also a delusion, and I feel that the truth is that people have little time to spare about others who are not central to their lives. To be able to remove the personal feelings out of the equation and try to rationally see the whole picture is also a sign that a person has grown. It’s just another one of the markers we use to try and find ourselves, to define our growth and change.\r\n\tSo…. time, change, and growth. I guess you can see where this loosely sewn together bit is going. How have you grown, and how have you changed? Are you happier than you were last year? Have you managed to find out if the path you’re pursuing is the one that you’ve always wanted? Are you certain of the meaning that it brings to you life? I ask this because these are the questions that I think are important, and because you seemed rather lost the last time we actually talked. Everyone who talks and opens up to me feels just like that- lost. When they find their way I become less valuable, more disposable. But trying to help people find their way, and catching people before they fall off cliffs, I still believe that there’s value in that.\r\n\tPart of me hopes that you are still lost because maybe then there would be something to talk about, something both of us can relate to. But my bigger hope is that you’ve found what you’ve wanted. I believe that you’re a good person, and it’s my hope that you have more than just the run of the mill thoughts. It has always been my wish that people like that could dodge the hardships of both society and existence to grasp at what is beyond the struggle- that thing I like to think of as meaning. If so, would it be possible to tell me what it’s like there?\r\n\tProbably nothing special. I know that somewhere in the back of my mind I think that people are not yet capable of even understanding what it means to be alive. Because we’re all so small, and we understand only fragments of the world, and whatever meaning is probably encased in the worldview that you have made for yourself. Such meaning is useless as a reference point for anyone else, and hearing your answer without first putting the effort to understand your worldview would make it sound like nonsense. I do not have the perspective to appreciate your answer, and it’s entirely my fault. After all, it was me who decided to raze even whatever hope we had to building a bridge between us. But I was tired of hurt, and I’d seen that pattern before. Sorry if I was a bit extreme. I wanted the cut, when it eventually happened, to be absolute. My rather horrifying approach was the only way I could think of achieving it, as the cut I wanted was a little different from the stereotypical ‘clean cut’ that people usually refer to. I hope that my actions did not make you jaded in any way. That I am most worried of.\r\n"}}};

    const PALETTE = [
      '#4e9af1','#f15a4e','#56d364','#e3b341','#b94ef1',
      '#4ef1e6','#f18c4e','#f14e9a','#79c0ff','#d2a8ff',
      '#ffa657','#7ee787','#ff7b72','#58a6ff','#a5d6ff'
    ];

    const themeColorMap = {};
    GRAPH_DATA.themes.forEach((t, i) => { themeColorMap[t.id] = PALETTE[i % PALETTE.length]; });

    const activeThemeIds = new Set(GRAPH_DATA.themeClusters.map(t => t.id));
    const filterEl = document.getElementById('theme-filter');
    GRAPH_DATA.themeClusters.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      filterEl.appendChild(opt);
    });

    const legendEl = document.getElementById('legend');
    const legendBodyHtml =
      '<div class="legend-title">Themes</div>' +
      GRAPH_DATA.themeClusters.map(t =>
        '<div class="legend-item">' +
          '<div class="legend-dot" style="background:' + themeColorMap[t.id] + '"></div>' +
          t.name +
        '</div>'
      ).join('') +
      '<div class="legend-title" style="margin-top:10px">Nodes</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div> Entry (circle)</div>' +
      '<div class="legend-item"><div class="legend-diamond"></div> Tag (diamond)</div>';
    legendEl.innerHTML =
      '<div class="legend-header" id="legend-header">' +
        '<span class="legend-header-label" id="legend-header-label">Legend</span>' +
        '<button type="button" id="legend-toggle" aria-label="Hide legend" title="Hide legend">Hide</button>' +
      '</div>' +
      '<div class="legend-body" id="legend-body">' + legendBodyHtml + '</div>';
    const legendHeader = document.getElementById('legend-header');
    const legendToggle = document.getElementById('legend-toggle');
    const legendHeaderLabel = document.getElementById('legend-header-label');
    function setLegendCollapsed(collapsed) {
      legendEl.classList.toggle('legend-collapsed', collapsed);
      legendToggle.textContent = collapsed ? 'Show' : 'Hide';
      legendToggle.setAttribute('aria-label', collapsed ? 'Show legend' : 'Hide legend');
      legendToggle.title = collapsed ? 'Show legend' : 'Hide legend';
      legendHeaderLabel.textContent = collapsed ? 'Legend · tap to expand' : 'Legend';
    }
    function toggleLegend() {
      setLegendCollapsed(!legendEl.classList.contains('legend-collapsed'));
    }
    legendToggle.addEventListener('click', e => {
      e.stopPropagation();
      toggleLegend();
    });
    legendHeader.addEventListener('click', () => toggleLegend());

    const entryCount = GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').length;
    const tagCount   = GRAPH_DATA.nodes.filter(n => n.node_type === 'tag').length;
    const statsEl = document.getElementById('stats');

    function tagTier(count) {
      if (count <= 1) return 'singleton';
      if (count <= 3) return 'recurring';
      return 'frequent';
    }

    function tagSize(count) {
      if (count <= 1) return 8;
      if (count <= 3) return 14;
      return 18;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function normalizeWs(s) {
      return String(s).replace(/\s+/g, ' ').trim();
    }

    /** Highlight evidence excerpt (strong) and surrounding paragraph (soft) in source text. */
    function highlightSourceText(rawText, excerpt) {
      const text = rawText || '';
      if (!excerpt || !text) return escapeHtml(text);

      const parts = excerpt.split(/\.\.\./).map(p => normalizeWs(p)).filter(Boolean);
      let idx = -1;
      let matchLen = 0;

      for (const part of parts) {
        if (part.length < 12) continue;
        const probe = part.slice(0, Math.min(60, part.length));
        const i = text.indexOf(probe.slice(0, 20));
        if (i >= 0) { idx = i; matchLen = part.length; break; }
        const collapsed = normalizeWs(text);
        const j = collapsed.indexOf(probe.slice(0, 30));
        if (j >= 0) {
          const ratio = j / Math.max(1, collapsed.length);
          idx = Math.floor(ratio * text.length);
          matchLen = Math.min(part.length, text.length - idx);
          break;
        }
      }

      if (idx < 0) return escapeHtml(text);

      const paraStart = Math.max(0, text.lastIndexOf('\n\n', idx));
      const paraEndRaw = text.indexOf('\n\n', idx + matchLen);
      const paraEnd = paraEndRaw >= 0 ? paraEndRaw : text.length;

      const before = text.slice(0, paraStart);
      const softBefore = text.slice(paraStart, idx);
      const strong = text.slice(idx, Math.min(idx + matchLen, text.length));
      const softAfter = text.slice(idx + strong.length, paraEnd);
      const after = text.slice(paraEnd);

      return escapeHtml(before) +
        '<span class="hl-soft">' + escapeHtml(softBefore) + '</span>' +
        '<span class="hl-strong">' + escapeHtml(strong) + '</span>' +
        '<span class="hl-soft">' + escapeHtml(softAfter) + '</span>' +
        escapeHtml(after);
    }

    const MIN_SHAPE_GAP = 44;
    /** Hierarchical cluster pull: primary theme (strong) > secondary theme (weaker) > tags (weakest). */
    const CLUSTER_PULL = { theme: 0.34, secondary: 0.12, tag: 0.05 };
    const CLUSTER_PASSES = 56;

    function nodeCollisionRadius(node) {
      if (node.data('node_type') === 'entry') return 9;
      const size = node.data('size') || 8;
      return size / 2 + 4;
    }

    /** Push overlapping nodes apart until every pair meets MIN_SHAPE_GAP between edges. */
    function enforceMinimumSeparation(cy, minGap, maxPasses) {
      maxPasses = maxPasses || 100;
      const nodes = cy.nodes().toArray();
      for (let pass = 0; pass < maxPasses; pass++) {
        let moved = false;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];
            const pa = a.position();
            const pb = b.position();
            let dx = pb.x - pa.x;
            let dy = pb.y - pa.y;
            let dist = Math.hypot(dx, dy);
            const minDist = nodeCollisionRadius(a) + nodeCollisionRadius(b) + minGap;
            if (dist < 1e-4) {
              const angle = Math.random() * Math.PI * 2;
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              dist = 1;
            }
            if (dist < minDist) {
              const push = (minDist - dist) / 2;
              const ux = dx / dist;
              const uy = dy / dist;
              a.position({ x: pa.x - ux * push, y: pa.y - uy * push });
              b.position({ x: pb.x + ux * push, y: pb.y + uy * push });
              moved = true;
            }
          }
        }
        if (!moved) break;
      }
    }

    function buildSecondaryThemeGroups() {
      const groups = {};
      GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').forEach(n => {
        (n.secondary_themes || []).forEach(st => {
          (groups[st] = groups[st] || []).push(n.id);
        });
      });
      return groups;
    }

    /** Tiered clustering after force layout: theme regions, then secondary affinities, then tag orbit. */
    function applyHierarchicalClustering(cy, themeCenters, secondaryGroups, passes) {
      passes = passes || CLUSTER_PASSES;

      for (let pass = 0; pass < passes; pass++) {
        const fade = 1 - pass / passes;
        const themePull = CLUSTER_PULL.theme * (0.35 + 0.65 * fade);
        const secondaryPull = CLUSTER_PULL.secondary * (0.35 + 0.65 * fade);
        const tagPull = CLUSTER_PULL.tag * (0.35 + 0.65 * fade);

        // Strongest: pull entries toward their primary theme region anchor
        cy.nodes('[node_type = "entry"]').forEach(node => {
          const center = themeCenters[node.data('theme')];
          if (!center) return;
          const p = node.position();
          node.position({
            x: p.x + (center.x - p.x) * themePull,
            y: p.y + (center.y - p.y) * themePull,
          });
        });

        // Weaker: entries sharing a secondary theme drift toward that sub-group centroid
        Object.values(secondaryGroups).forEach(ids => {
          if (ids.length < 2) return;
          const nodes = ids.map(id => cy.getElementById(id)).filter(n => n.nonempty());
          if (nodes.length < 2) return;
          const cx = nodes.reduce((s, n) => s + n.position('x'), 0) / nodes.length;
          const cyPos = nodes.reduce((s, n) => s + n.position('y'), 0) / nodes.length;
          nodes.forEach(node => {
            const p = node.position();
            node.position({
              x: p.x + (cx - p.x) * secondaryPull,
              y: p.y + (cyPos - p.y) * secondaryPull,
            });
          });
        });

        // Weakest: tags orbit just outside their connected entry cluster
        cy.nodes('[node_type = "tag"]').forEach(tag => {
          const entries = tag.neighborhood('node[node_type = "entry"]');
          if (entries.length === 0) return;
          let cx = 0;
          let cyPos = 0;
          entries.forEach(e => { cx += e.position('x'); cyPos += e.position('y'); });
          cx /= entries.length;
          cyPos /= entries.length;

          const theme = entries[0].data('theme');
          const themeAnchor = themeCenters[theme] || { x: cx, y: cyPos };
          let dx = cx - themeAnchor.x;
          let dy = cyPos - themeAnchor.y;
          const len = Math.hypot(dx, dy) || 1;
          dx /= len;
          dy /= len;
          const orbit = 110 + entries.length * 22;
          const targetX = cx + dx * orbit;
          const targetY = cyPos + dy * orbit;

          const p = tag.position();
          tag.position({
            x: p.x + (targetX - p.x) * tagPull,
            y: p.y + (targetY - p.y) * tagPull,
          });
        });

        if (pass % 4 === 3) enforceMinimumSeparation(cy, MIN_SHAPE_GAP, 20);
      }
    }

    function computeThemeCenters(clusters) {
      const n = clusters.length || 1;
      const radius = Math.max(780, n * 240);
      const centers = {};
      clusters.forEach((t, i) => {
        const angle = (2 * Math.PI * i) / n - Math.PI / 2;
        centers[t.id] = { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
      });
      return centers;
    }

    function seedPositions(centers) {
      const positions = {};
      const entriesByTheme = {};
      GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').forEach(n => {
        const th = n.theme || 'unknown';
        (entriesByTheme[th] = entriesByTheme[th] || []).push(n);
      });

      Object.entries(entriesByTheme).forEach(([theme, list]) => {
        const c = centers[theme] || { x: 0, y: 0 };
        list.forEach((n, i) => {
          const angle = (2 * Math.PI * i) / list.length;
          const r = 155 + list.length * 44;
          positions[n.id] = {
            x: c.x + Math.cos(angle) * r,
            y: c.y + Math.sin(angle) * r,
          };
        });
      });

      GRAPH_DATA.nodes.filter(n => n.node_type === 'tag').forEach(tag => {
        const linkedIds = GRAPH_DATA.edges.filter(e => e.target === tag.id).map(e => e.source);
        const linkedPos = linkedIds.map(id => positions[id]).filter(Boolean);
        if (!linkedPos.length) {
          positions[tag.id] = { x: (Math.random() - 0.5) * 300, y: (Math.random() - 0.5) * 300 };
          return;
        }
        const cx = linkedPos.reduce((s, p) => s + p.x, 0) / linkedPos.length;
        const cy = linkedPos.reduce((s, p) => s + p.y, 0) / linkedPos.length;
        const entry = GRAPH_DATA.nodes.find(en => en.id === linkedIds[0]);
        const themeCenter = centers[entry?.theme] || { x: cx, y: cy };
        let dx = cx - themeCenter.x;
        let dy = cy - themeCenter.y;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len;
        dy /= len;
        const spread = (linkedPos.length - 1) * 28;
        const push = 200 + spread;
        positions[tag.id] = {
          x: cx + dx * push + (Math.random() - 0.5) * 60,
          y: cy + dy * push + (Math.random() - 0.5) * 60,
        };
      });

      return positions;
    }

    if (entryCount === 0) {
      statsEl.textContent = 'No ideas yet.';
      document.querySelector('.hint').style.display = 'none';
      legendEl.style.display = 'none';
      document.getElementById('theme-labels').style.display = 'none';
      document.getElementById('cy').insertAdjacentHTML('afterend',
        '<div class="empty-state"><h2>Your idea map is empty</h2>' +
        '<p>Process a diary entry to get started:<br>' +
        '<code>npm run process -- --file entry.txt --title "My Entry"</code></p></div>'
      );
    } else {
      statsEl.textContent = entryCount + ' ideas · ' + tagCount + ' tags · ' + activeThemeIds.size + ' theme regions';

      const themeCenters = computeThemeCenters(GRAPH_DATA.themeClusters);
      const secondaryThemeGroups = buildSecondaryThemeGroups();
      const initialPositions = seedPositions(themeCenters);
      const anchoredPositions = {};

      const elements = [];

      GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').forEach(n => {
        elements.push({ group: 'nodes', data: {
          id: n.id,
          node_type: 'entry',
          color: themeColorMap[n.theme] || '#6e7681',
          theme: n.theme,
          secondary_themes: n.secondary_themes || [],
          tags: n.tags || [],
          core_idea: n.core_idea || '',
          evidence_excerpt: n.evidence_excerpt || '',
          source_id: n.source_id || '',
        }, position: initialPositions[n.id] });
      });

      GRAPH_DATA.nodes.filter(n => n.node_type === 'tag').forEach(n => {
        const tier = tagTier(n.connectionCount);
        elements.push({ group: 'nodes', data: {
          id: n.id,
          label: n.label ? n.label.replace(/_/g, ' ') : n.id.replace(/_/g, ' '),
          node_type: 'tag',
          connectionCount: n.connectionCount,
          tagTier: tier,
          size: tagSize(n.connectionCount),
        }, position: initialPositions[n.id] });
      });

      GRAPH_DATA.edges.forEach(e => {
        elements.push({ group: 'edges', data: { id: e.id, source: e.source, target: e.target } });
      });

      const cy = cytoscape({
        container: document.getElementById('cy'),
        elements,
        minZoom: 0.25,
        maxZoom: 3,
        style: [
          {
            selector: 'node[node_type = "entry"]',
            style: {
              'background-color': 'data(color)',
              'width': 12,
              'height': 12,
              'shape': 'ellipse',
              'label': '',
              'border-width': 1.5,
              'border-color': 'data(color)',
              'border-opacity': 0.5,
              'background-opacity': 0.95,
            }
          },
          {
            selector: 'node[node_type = "entry"]:selected',
            style: {
              'border-width': 2.5,
              'border-opacity': 1,
              'border-color': '#ffffff',
              'width': 14,
              'height': 14,
            }
          },
          {
            selector: 'node[node_type = "tag"]',
            style: {
              'background-color': '#12171f',
              'border-color': '#58a6ff',
              'border-width': 1.5,
              'shape': 'diamond',
              'width': 'data(size)',
              'height': 'data(size)',
              'label': '',
            }
          },
          {
            selector: 'node[node_type = "tag"].show-label',
            style: {
              'label': 'data(label)',
              'font-size': '8px',
              'color': '#b1bac4',
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': 5,
              'text-max-width': '64px',
              'text-outline-color': '#0a0e14',
              'text-outline-width': 2,
            }
          },
          {
            selector: 'node[node_type = "tag"][tagTier = "singleton"]',
            style: {
              'opacity': 0.5,
              'border-width': 1,
            }
          },
          {
            selector: 'node[node_type = "tag"][tagTier = "frequent"]',
            style: {
              'border-width': 2,
              'background-color': '#1a2332',
            }
          },
          {
            selector: 'node[node_type = "tag"].active, node[node_type = "tag"]:selected',
            style: {
              'border-color': '#79c0ff',
              'opacity': 1,
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 1.5,
              'line-color': '#484f58',
              'opacity': 0.38,
              'curve-style': 'bezier',
              'target-arrow-shape': 'none',
            }
          },
          {
            selector: 'edge.emphasized',
            style: {
              'opacity': 0.85,
              'line-color': '#58a6ff',
              'width': 2.5,
            }
          },
          {
            selector: 'node.neighbor-emphasis',
            style: { 'opacity': 1, 'border-opacity': 1 }
          },
          { selector: 'node.dimmed', style: { 'opacity': 0.08 } },
          { selector: 'edge.dimmed', style: { 'opacity': 0.06 } },
        ],
        layout: {
          name: 'cose',
          animate: true,
          animationDuration: 700,
          fit: true,
          padding: 200,
          randomize: false,
          nodeRepulsion: 58000,
          nodeOverlap: 64,
          idealEdgeLength: 270,
          edgeElasticity: 0.22,
          nestingFactor: 1,
          gravity: 0.03,
          numIter: 2000,
        },
      });

      // Show labels only on recurring tags; singletons stay quiet until hover
      cy.nodes('[node_type = "tag"][tagTier != "singleton"]').addClass('show-label');

      const themeLabelsEl = document.getElementById('theme-labels');
      const labelEls = {};
      GRAPH_DATA.themeClusters.forEach(t => {
        const el = document.createElement('div');
        el.className = 'theme-label';
        el.textContent = t.name;
        el.style.color = themeColorMap[t.id] || '#6e7681';
        themeLabelsEl.appendChild(el);
        labelEls[t.id] = el;
      });

      function updateThemeLabels() {
        const buckets = {};
        cy.nodes('[node_type = "entry"]').forEach(n => {
          if (n.hasClass('dimmed')) return;
          const th = n.data('theme');
          if (!buckets[th]) buckets[th] = { x: 0, y: 0, n: 0 };
          const p = n.renderedPosition();
          buckets[th].x += p.x;
          buckets[th].y += p.y;
          buckets[th].n += 1;
        });
        Object.entries(labelEls).forEach(([id, el]) => {
          const b = buckets[id];
          if (!b || b.n === 0) { el.style.display = 'none'; return; }
          el.style.display = 'block';
          el.style.left = (b.x / b.n) + 'px';
          el.style.top = (b.y / b.n) + 'px';
        });
      }

      function saveAnchors() {
        cy.nodes().forEach(n => {
          anchoredPositions[n.id()] = { x: n.position('x'), y: n.position('y') };
        });
      }

      /** Snap a dragged node back to its layout anchor. */
      function snapBack(node) {
        const anchor = anchoredPositions[node.id()];
        if (!anchor) return;
        node.animation(
          { position: { x: anchor.x, y: anchor.y } },
          { duration: 400, easing: 'ease-out-cubic', complete: updateThemeLabels },
        ).play();
      }

      // Seed anchors from preset positions until layout finishes
      Object.entries(initialPositions).forEach(([id, pos]) => {
        anchoredPositions[id] = { x: pos.x, y: pos.y };
      });

      cy.on('layoutstop', () => {
        applyHierarchicalClustering(cy, themeCenters, secondaryThemeGroups);
        enforceMinimumSeparation(cy, MIN_SHAPE_GAP);
        saveAnchors();
        updateThemeLabels();
        cy.fit(120);
      });
      cy.on('pan zoom resize', updateThemeLabels);

      cy.nodes().grabify();

      // Cytoscape fires "free" when a grabbed node is released
      cy.on('free', 'node', evt => {
        snapBack(evt.target);
      });

      const panel = document.getElementById('info-panel');
      const infoTitle = document.getElementById('info-title');
      const infoContent = document.getElementById('info-content');
      const sourceModal = document.getElementById('source-modal');

      function closePanel() { panel.classList.remove('open'); }
      function closeSourceModal() { sourceModal.classList.remove('open'); }

      function openSourceView(entryId) {
        const entryNode = GRAPH_DATA.nodes.find(n => n.id === entryId && n.node_type === 'entry');
        if (!entryNode) return;
        const src = GRAPH_DATA.sources[entryNode.source_id];
        if (!src) return;
        document.getElementById('source-modal-title').textContent = src.title;
        document.getElementById('source-modal-meta').textContent =
          (src.created_at ? src.created_at + ' · ' : '') + entryNode.id;
        document.getElementById('source-modal-body').innerHTML =
          highlightSourceText(src.raw_text, entryNode.evidence_excerpt);
        sourceModal.classList.add('open');
      }

      function showEntryPanel(d) {
        const themeData = GRAPH_DATA.themes.find(t => t.id === d.theme);
        const color = themeColorMap[d.theme] || '#888';
        const src = GRAPH_DATA.sources[d.source_id];
        infoTitle.textContent = d.core_idea || 'Entry';
        infoContent.innerHTML =
          (d.evidence_excerpt
            ? '<div class="info-section"><div class="info-label">Evidence</div>' +
              '<div class="info-value" style="font-style:italic;color:#9da7b3">' +
              escapeHtml(d.evidence_excerpt) + '</div></div>'
            : '') +
          '<div class="info-section"><div class="info-label">Theme</div>' +
            '<div class="info-value"><span class="theme-dot" style="background:' + color + '"></span>' +
            (themeData ? themeData.name : d.theme) + '</div></div>' +
          (d.tags && d.tags.length
            ? '<div class="info-section"><div class="info-label">Tags</div><div class="tag-list">' +
              d.tags.map(t => '<span class="tag">' + t.replace(/_/g, ' ') + '</span>').join('') +
              '</div></div>'
            : '') +
          (src
            ? '<div class="info-section"><div class="info-label">Source</div>' +
              '<div class="info-meta">' + escapeHtml(src.title) +
              (src.created_at ? ' · ' + escapeHtml(src.created_at) : '') + '</div></div>'
            : '') +
          (src
            ? '<button type="button" class="btn-primary" id="view-source-btn" style="width:100%;margin-top:8px">' +
              'View full entry</button>'
            : '');
        panel.classList.add('open');
        const btn = document.getElementById('view-source-btn');
        if (btn) btn.onclick = () => openSourceView(d.id);
      }

      function showTagPanel(tagNode) {
        const d = tagNode.data();
        const connEntries = tagNode.neighborhood('node[node_type = "entry"]');
        infoTitle.textContent = d.label || d.id;
        let html =
          '<div class="info-section"><div class="info-label">Recurring motif</div>' +
          '<div class="info-value">' + d.connectionCount + ' connected entr' +
          (d.connectionCount === 1 ? 'y' : 'ies') + '</div></div>' +
          '<div class="info-section"><div class="info-label">Connected ideas</div>';

        connEntries.forEach(n => {
          const ed = n.data();
          const src = GRAPH_DATA.sources[ed.source_id];
          const snippet = ed.core_idea || ed.evidence_excerpt || '';
          html +=
            '<div class="entry-link" data-entry-id="' + ed.id + '">' +
              '<div class="entry-link-title">' + escapeHtml(src ? src.title : ed.id) + '</div>' +
              '<div class="entry-link-snippet">' + escapeHtml(snippet.slice(0, 160)) +
              (snippet.length > 160 ? '…' : '') + '</div>' +
            '</div>';
        });
        html += '</div>';
        infoContent.innerHTML = html;
        panel.classList.add('open');
        infoContent.querySelectorAll('.entry-link').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.getAttribute('data-entry-id');
            cy.nodes('#' + id).select();
            showEntryPanel(cy.nodes('#' + id).data());
          });
        });
      }

      cy.on('mouseover', 'node', evt => {
        const node = evt.target;
        cy.edges().removeClass('emphasized');
        cy.nodes().removeClass('neighbor-emphasis');
        node.connectedEdges().addClass('emphasized');
        node.neighborhood('node').addClass('neighbor-emphasis');
        if (node.data('node_type') === 'tag') {
          node.addClass('active show-label');
        }
      });
      cy.on('mouseout', 'node', evt => {
        const node = evt.target;
        cy.edges().removeClass('emphasized');
        cy.nodes().removeClass('neighbor-emphasis active');
        if (node.data('node_type') === 'tag' && node.data('tagTier') === 'singleton' && !node.selected()) {
          node.removeClass('show-label');
        }
      });

      cy.on('tap', 'node[node_type = "entry"]', evt => {
        showEntryPanel(evt.target.data());
      });
      cy.on('tap', 'node[node_type = "tag"]', evt => {
        showTagPanel(evt.target);
      });

      cy.on('tap', evt => { if (evt.target === cy) closePanel(); });
      document.getElementById('info-close').addEventListener('click', closePanel);
      document.getElementById('source-modal-close').addEventListener('click', closeSourceModal);
      sourceModal.addEventListener('click', e => {
        if (e.target === sourceModal) closeSourceModal();
      });

      filterEl.addEventListener('change', e => {
        const themeId = e.target.value;
        cy.elements().removeClass('dimmed');
        if (!themeId) { updateThemeLabels(); return; }
        cy.nodes('[node_type = "entry"]').forEach(n => {
          if (n.data('theme') !== themeId) n.addClass('dimmed');
        });
        cy.nodes('[node_type = "tag"]').forEach(n => {
          const anyVisible = n.neighborhood('node[node_type = "entry"]').some(en => !en.hasClass('dimmed'));
          if (!anyVisible) n.addClass('dimmed');
        });
        cy.edges().forEach(ed => {
          if (ed.source().hasClass('dimmed') || ed.target().hasClass('dimmed')) ed.addClass('dimmed');
        });
        updateThemeLabels();
      });

      document.getElementById('reset-btn').addEventListener('click', () => {
        cy.elements().removeClass('dimmed');
        filterEl.value = '';
        updateThemeLabels();
      });
      document.getElementById('fit-btn').addEventListener('click', () => {
        cy.fit(80);
        updateThemeLabels();
      });
    }
  </script>
</body>
</html>
