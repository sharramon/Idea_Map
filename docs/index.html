 then great, you've found a solution to a problem you had- namely entertainment.\r\n\r\nHowever, if I were ever to have a kid who I wished the best for I think I would do the same as my dad did. I would let them indulge in whatever they liked, but I'd nudge them in directions that might challenge them. Since there is much MUCH more value you could get out of books and the time spent reading than just reading the next installation of 'you're secretly special and here's why, also swords and sex'.\r\n\r\nThere is so much more to life, and books are treasure troves. They're amazing repositories of experience that people have put together in the hope that they would help someone understand some corner of life that they thought was worth dedicating their lives to. Entertainment is great, and I read weekly manga as a habit from my teenage years in Korea. But I also read Woolf, and following her along on her weird trotting of thoughts that paints a picture of life is so... precious. Trying to piece together Dostoevsky's nihilism is sometimes utterly terrifying and still hopeful. There are questions they induce in you that I think make life a little bit more interesting, and slightly more full of worth. This is why I always try to see if I can get people to read more difficult books, and it's why I try to read more difficult books (and I have a long way to go).\r\n\r\nI would never look down on people who are still reading for entertainment. But there is a deep frustration that's felt when someone reading something like 'The Name of the Wind' tries to argue it has equal literary merit as compared to something like JR by Gaddis. Not because I'm trying to gatekeep, but because there's just SO. MUCH. LIFE. that's being missed in this statement. But these are things I only really feel with my friends. Because I KNOW that if they could just crack open a more 'difficult' (heavy air quotes) book they could find so much more there. I recently finally got a friend to read 'The Idiot', and they're enamoured. They said they loved how the characters seem to really try and talk to each other, and that the way that the prince disarms everyone with his innocence reminds him of himself and how he tries so hard to maintain what seems to come naturally for this character.\r\n\r\nBooks can be difficult, but a lot of people miss the point entirely and use this difficulty to try and set themselves apart as 'true readers'. It's no wonder there's huge blowback because of these types of approaches to getting people to read. Books are about life, and experiences, and beliefs, and of course it's going to be difficult to convey these things. There's going to be several styles that people have tried when trying to convey this desperation of life and beauty. It's NOT the difficulty and the 'status' that people seem to think that reading such books confers them that should be the focus, it's the sharing of life and ideas that should be considered.\r\n\r\nThere's a book called 'Rights of the Reader' by Pennac that I absolutely loved (and gave away to a friend as a going away present), and there was this bit that I really liked about a Professor who would walk into the classroom and just read a book to his students. He would not expect any of them to come with knowledge of the greats of literature, but would just offer up these books as a stand-alone gift. He said (I'm heavily paraphrasing) that it was a shame to have to read books like this in a room. That to read was to want to go with Kierkegaard and rage against his father about life and God, and to look up at the pointed roofs of churches and try to figure out the point of life itself. Sadly, the book is the best (if poor) substitute. So they can only but share it and converse with each other.\r\n\r\nThis has become a bit long, and I apologize if this has become a bit preachy... but I dunno. I just feel a bit strongly about this whole 'why read classics' thing that seems so prevalent. "},"source_014":{"id":"source_014","title":"12/02/2011","created_at":"2026-06-28","raw_text":"Those who know loneliness are the ones who will understand what it means to be lonely. The ones who reach out to help others are the ones who know pain. Perhaps humans are limited in their understanding to see beyond their own experiences; but the fact that they seek to comfort those who are going through the same hardships as they have…. Perhaps that’s where we can see hope.\r\nHope for mankind.\r\n"},"source_015":{"id":"source_015","title":"02/02/2021","created_at":"2026-06-28","raw_text":"Society is constructed. No, that isn’t quite true, as it implied that there is a maniacal, malevolent mind trying to build society brick-by-brick. What I mean to say is that society is a construction.\r\n\tBy a construction I mean to say that it carries two important qualities: it is artificial, and it is malleable. Society, being artificial, has no hard and fast truths; no absolute values. So all our morals, justice, and freedoms are all just constructs built on abstract nothings. So all of society is malleable, and nothing that is has to be that way. We can change it.\r\n\tIn the Western consciousness, the Age of Enlightenment and subsequent existentialist philosophies stand as examples of what can be achieved when we realize the shortcomings of the current social narrative on a mass scale. Within a century we distanced ourselves from the monarchies that had been the ruling institutions for the past few millennia, and had created narratives around personal freedoms, rights, and happiness. It is on these ideals that the French Revolution, the Napoleonic wars, and the American Revolution happened. The driving humanist forces behind these movements eventually eroded Christianity, with Nietzsche declaring that “God is dead … and we have killed him”.\r\nNow these themes of truth in science and the general meaningless of life have become the new status quo. But where are we now? The progress of science and economy has brought us this far and helped us get away from religious doctrine and feudalistic societies. But now the themes of the day are a loss of solid moralities, near kafkaesque nightmares of bureaucracy, and marketization of our own attention. We are not the Ubermen that Nietzsche dreamed of, nothing like the absurd heroes of Camus, or the humanists living in good faith that Sartre wanted. We’ve replaced religion with beliefs in science, nationalism, or political parties. Economy has given us scale that can be seen in the aggressive expansion of the village into the metropolis, and the village store, became the national franchise, became the global mega Corp. The everyday man is placed further and further away from any kind of impact or power. All of the promise of democracy is abstracted away to a vote or two every few years backed with rhetoric and little else, with no clear way of seeing how anything impacts anything. Layers and layers of interests create localized mists that block one from seeing anything clearly past a few steps, creating middle management in everything, resulting in more paperwork, more confusion, more drudgery. What’s worse is that it’s not some mastermind villain with an overarching plan that’s doing this to us - it’s just shortsightedness. What seems to make sense in the short term keeps screwing us over in the long term. The built-in apathy towards a system that seems too big to change doesn’t help either.\r\n The internet came with the promise of a united world with ties to everything, and while it’s done massive good by giving people access to everything, it also gave access to us. Our attention is grabbed and marketed to, everything is a Skinner box that’s designed to induce a limbo-like passivity between our frantic hours of work. The marketing to our tastes divides us more than ever, with so much info spewing out that our overactive brains can make any pattern out of the chaos, and this pattern informs the machines, which then feed us more info to reinforce comfortable patterns. Challenging us creates disruption in user engagement, it’s just easier to keep feeding us the beliefs we already hold.\r\nThe above is now becoming pretty obvious, and it’s receiving attention right now. But as with all games, the trick is to play the meta-game. The real problem isn’t that we need single page, easy-to-read tax forms, or that we need to regulate the way the internet hijacks our dopamine seeking brains. The problem is that we need to figure out how to see and interact with the systems that make up our world. Even the world of startups, heralded as the bastion of disruption and innovation, run into these same problems as most of the problems they’re trying to solve these days are just optimization and automation problems. It seems to be mostly fintech, automated delivery, better rental services, etc despite their claims to massive disruption. (So what are we supposed to do? Purchase stocks as we get our food delivered to us in our airbnb to utopia? Like Jesus startups, get your shit together. This is at best zero to point-oh-one). But this is just a symptom of the problem I’m trying to point to. In a world where you can’t see everything, the best most people will try to do is optimize their immediate surroundings to a local maximum. \r\nWhat do I mean by meta-game? Well let’s take a brief look at the reality that we live in. We live in a supposed meritocratic capitalist society. None of this is a potshot at meritocracy or capitalism, in fact I’m a big fan. But the ‘supposed’ in supposed meritocratic society comes in when we start measuring for specific performance metrics such as rote memorization, the ability to write to a rubric, or quickly finding mathematical solutions. These are supposedly merits in some sense, but for what? Why? How? We don’t quite know, but we stick numbers to them, and then the massive rat race begins to optimize to maximize these numbers. Capitalism is just this but bigger. Money was supposed to be a tool to help us live, all it was was just a way for us to carry around goods. Unfortunately, money is inherently countable and can be optimized for. So all hell broke loose bit-by-bit until somehow we’ve ended up at a society that trades money backed on nothing but trust in the country’s institution worth as much or as little as our faith in God. A belief that’s recently being shown on full display in the crypto craze. It’s a system where human lives are just another number on the balance sheet of insurance companies in a crazy bid for the richest, who definitely can’t need more money more than people need their lives, to get the highest returns so that they can watch the numbers on their scoreboard go up. This is part of the meta-game. If we introduce a number and tie it to power, people will try to optimize for this, even to the point of absurdity.\r\nBut to even play the meta-game properly we need to get the data and then the means to create an abstracted, simplified view of all of society in a way that we can run it through our pattern finding brains. One would be inclined to tell me this is impossible. But isn’t this precisely what education is? The fact that a load of people understand basic human history, basic economics, mathematics, literature, and more is nothing short of a miracle from this ‘can’t do’ angle. The only problem is that we don’t know what the data for this abstracted worldview is. But this is only part of the problem. If we solve the world today that’s just playing a form of the startup industries of trying to solve the local problem. This isn’t the full meta-game.\r\nThe full meta-game comes in when we go into society building. In the creation of societies there are moves that we can make, the creation of cultural heroes and villains, a central narrative, celebrations. America is the ‘city upon a hill’ and ‘the land of the free, home of the brave’ these are myths that identify America. The victory against the British and then the Nazis formed the backbone of the ideas of American justice and freedom for the individual. We celebrate Martin Luther King as a paragon of equality and look to George Washington as the picture of American decency with his apparent inability to even lie. We’ve put capitalism on a pedestal and our tellings of the Cold War with the Soviet Union and their apparently ‘evil’ communism to the point that the word itself feels like it has negative connotations somehow where once the idea itself meant salvation to near slave classes in Europe. Society and its beliefs have building blocks. But why is it important to learn this? Why not just stick to solving our own society? What good is this meta-game?\r\nIn a now-famous commencement speech David Foster Wallace tells this small ditty.\r\n\r\n“There are these two young fish swimming along and they happen to meet an older fish swimming the other way, who nods at them and says “Morning, boys. How’s the water?” And the two young fish swim on for a bit, and then eventually one of them looks over at the other and goes “What the hell is water?””\r\n\r\nThis short parable is supposed to show you how hard it is to even see the most important things around you when it has become part of your everyday life, ingrained in your reality and identity. Could you imagine telling a priest of the Spanish Inquisition that maybe killing heretics was a rather ridiculous notion on the grounds that God didn’t exist? God was an absolute to them. Or perhaps to bring it home, that the concept of nations is a rather ridiculous and sub-optimal building block to base your identity around, as this idea of nationalism was started in a big way around the 18th century by those in power in order to indoctrinate you to stay loyal after the whole Enlightenment made it infeasible to smack you with the good-ol divine right of Kings to rule over their people given by God? That this idea was a perfect idea to then brainwash its citizens to their right to glory and start two of the most devastating wars in human history? These are brilliant moves on the part of culture creators, so brilliant that we can no longer even see them as moves and accept them as truths. If we don’t play the meta-game we get stuck again at another local maximum, and then human effort is back again to solving local optimization problems.\r\nAnother reason that it’s important to learn the meta-game is simply the fact that if one wants to learn how to impact society, one must know the moves and rules. To paraphrase Wittgenstein, one must know the general rules of chess to meaningfully ask what a ‘king piece’ is. So we must try our hand at this society building over and over and over again in order to understand exactly what it is that’s being done, to learn the rules and the pieces. This is where the linear approximations of realities really shines.\r\nWhile these are the big moves, we run into another problem. Because we’re creating approximations they run the risk of losing too much important information on the way there. The systems are trying to be objective about life, but this is in itself an impossibility. In The View From Nowhere Nagel points out that trying to achieve any type of objectivity is a kind of paradox. This is because all experience is personal and subjective. Any attempt at a more objective experience is ultimately just a shot at a larger subjective experience. In a similar vein, even with all the objective truth in the world it’s impossible to deny the individual. It would be disingenuous to ask that one forgo one’s interests for some kind of greater good constantly. \r\nLife has to be lived. This is what Nagel meant when he said that all experience is subjective. Experience can only be self-centered. Similar ideas are encountered in fields such as enactivism where experience itself is said to be embodied, and so having a body is vital to how we experience the world. Nagel has even said that “our own experience provides the basic material for our imagination” in his extremely famous paper What is it like to be a bat?. In the study of language Wittgenstein talks about how language is limited because communicating is like trying to talk about an insect in a box without showing the insect. Even worse, agreeing on what an insect is requires two people doing this at the same time until they just kind of come to an agreement that their ideas seem similar enough. Yet what if this agreement was impossible? What if I had something in my box that you simply didn't? Wittgenstein has an animal thought of his own here where he says “If a lion could talk, we would not understand him”. In short, with such disparate states, we could not even imagine the basic truths that build the ground of these experiences. Since we’re trying to understand people, we won’t run into something as extreme as trying to embody the experience of an echolocating bat or a talking lion. However, trying to understand people from other countries, or socio-economic classes, or even just different jobs has a lot of barriers. Trying to figure out how to efficiently absorb the information from these different experiences will do a lot to increase the basic material for our imagination.\r\nIn Andy Weir’s The Egg, the protagonist finds himself in the afterlife talking to a type of god. They find out not only that reincarnation is real, but also that all life in the universe is just him reincarnated over and over again. The reason being that he is being trained for godhood himself. This multitude of human lives is what would be our ultimate goal. It would be the attempt to try to create a type of human singularity with the hope that we could transcend such short-sightedness to create near god-like humans where the abstract problems would become personal ones. Simply, what we think as the limits of our attempts at objectivity would just become the subjective to this being while missing none of the detail. A person who has experienced their own hunger wants food, a person who has experienced a million hungers paired with a million gourmet meals would see the disparity (or so the hope goes). While I have said that it would be disingenuous to ask the individual to forgo one’s own interests for the greater good, here we are hoping that our human singularity would feel the greater good to be their own interest, to feel the big picture personally. For isn’t this what a god is?\r\nIt is oddly also a great place to start the whole process. As it’s hard to care about models of reality, but living a life that’s radically different from our own would give us the right tools to ‘see the water’. Everything follows from this. The personalization of a multitude of lives by having lived them, and the ability to iterate through different versions of social structures would give us reason and means to try and approach our reality as something that is both something that can be understood and changed. This is the perfect picture. The question is then, where do we start?\r\nI think we start at the bottom, from the experiences. We must cultivate a generation of people who have true varied perspectives, as this is what drives the need for the rest of the picture. The most dangerous lie is that good is absolute, and that good will find its way to the top somehow. There is no good, only cultivated values. We already have enough food to feed everyone, and the means to house everyone. We have the means to generate and analyze way too much data, and we can go anywhere, talk to anyone. The physical world has been pushed far enough that many of our problems shouldn’t exist, and this is thanks to the age of enlightenment, science, and economy speeding forward with material progress. Now we are by far the weakest link, unable to deal with the complexity of the world we have created. We have everything we need to create a feasible utopia. Now it’s just a problem of having to better ourselves.\r\n"},"source_016":{"id":"source_016","title":"04/06/2017","created_at":"2026-06-28","raw_text":"04/06/2017\r\nWhat are you not\r\n \r\n\tI’m a little teapot short and stout. I’m also not very honest. Note here that I have avoided the Epimenides paradox by not claiming that I always lie. Everybody lies, as much as everybody dies. I think that the ninth commandment was poorly thought out, like rules parents make for their first child- well meant, but without any thought to realism. Either that or God really didn’t want real estate prices in heaven going up. Being priced out of heaven by humans would be too much of a hilarious straight shooting comedy for Jesus after all.\r\n\tBut even in this sad cesspool of sin, something my Catholic school assured me the earth is, I’m particularly bad at observing this particular commandment. Lying comes a little too naturally to me. I’m not sure why. If I had to guess though, I would say that I’m afraid. In fact, I think the main, or perhaps only reason people lie is because they’re afraid. Afraid of rejection, of being found out for the fraud that they think they are, afraid of reality. So according to transitive properties I must lie more than everyone else because I’m more afraid than everyone else.\r\n\tNow that took a rather dark turn. But hey, I could be lying. Because what could I possibly be so afraid of? Why should I be more afraid than everyone else? It seems rather presumptuous to say that I’m more afraid. After all the mortality rate of my peer group should be orders of magnitude lower than that of people in Israel, or the middle-eastern countries seemingly constantly at war against … democracy(?), I think is what the media tells me. My mortality rate is so low that I know stupid facts like that eating one-thousand bananas will increase my mortality rate by 1 micromort, meaning that the probability of my death goes up by one millionth. This is rather impressive. I will soon look into buying one thousand bananas. These challenges are really what makes me feel alive. Thrilling.\r\n\tMaybe I’m afraid of being dropped, of people finding out that I’m some sort of failure and deciding that I’m not worth their time. So perhaps I’m not very confident. This seems to feel like it has some inkling of truth. Like many deep seated traumas, this one could even be rooted in my childhood. Those moments when I returned home with a bad grade and had to then endure hours of being shouted at, or saying that I wanted to be an artist and having my drawings be mocked. At the very least, modern outlooks on parenting trends seem to agree with me. Look at that, by asking what I’m not, I have seem to started to answer what I am. Well, let’s not dwell in this place too much. The pained confusion of why I’m not confident is much more enjoyable to read than me moaning about why I am unconfident; a rather drab and common topic on internet forums.\r\n\tI’m not honest, but I try my best to be genuine. Oddly, I have come to realize more and more that those who live life to the fullest seem to make a habit of being honest. So I don’t think I can live a genuine life without living an honest life. Being afraid of reality and rejection would mean that I can only run and stuff my head in the sand- an idiom that has its roots in ostrich behavior by the way. \r\n\tBut I’m pretty sure I’m not an ostrich.\r\nI think I like this answer to this prompt.\r\nI am not an ostrich.\r\n"},"source_017":{"id":"source_017","title":"04/22/2014","created_at":"2026-06-28","raw_text":"Myself and you\r\n\r\nAnd hello stranger! Here is myself, and there is yourself. Who am I? And who are you? I would much like to tell you who I am, and I would much like to hear who you are.\r\n\r\nBut how limited our means to do this. All language and art can't cover our whole existence. For my thoughts create a world, and your thoughts your world.\r\nHow can we express a world of thoughts with words so untrained? Or with drawings so unpolished? Even with mastery, perhaps I would be able to show you just one instant of thought that I hold precious. If I ever do I only hope that you too will hold this moment precious.\r\n\r\nTo say that a world exists in one's mind sounds marvelous! Doesn't it quite? To say that 'I'm special because I hold my own world'. But how sad is it at the same time to hold a whole world to yourself. Is it not depressing to think that I live in such isolation from you, and you from me? I'm afraid that my world is rather queer and alien. I hope it does not dissuade you from knowing me.\r\n\r\nFor I want to be known. I do so very want to be seen. I do so very want to see. What lies past that smiling face that you always put on and what thoughts beyond the 'how are you's and 'I'm doing great thank you!'\r\n\r\nBecause without this the world is a world of worlds. And in so many worlds one little thought does get rather lonely. Are you not lonely too? So unsure and ill-placed?\r\n"}}};

    const PALETTE = [
      '#4e9af1','#f15a4e','#56d364','#e3b341','#b94ef1',
      '#4ef1e6','#f18c4e','#f14e9a','#79c0ff','#d2a8ff',
      '#ffa657','#7ee787','#ff7b72','#58a6ff','#a5d6ff'
    ];

    const themeColorMap = {};
    GRAPH_DATA.themes.forEach((t, i) => { themeColorMap[t.id] = PALETTE[i % PALETTE.length]; });

    const activeThemeIds = new Set(GRAPH_DATA.themeClusters.map(t => t.id));
    const filterEl = document.getElementById('theme-filter');
    GRAPH_DATA.themeClusters.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      filterEl.appendChild(opt);
    });

    const legendEl = document.getElementById('legend');
    const legendBodyHtml =
      '<div class="legend-title">Themes</div>' +
      GRAPH_DATA.themeClusters.map(t =>
        '<div class="legend-item">' +
          '<div class="legend-dot" style="background:' + themeColorMap[t.id] + '"></div>' +
          t.name +
        '</div>'
      ).join('') +
      '<div class="legend-title" style="margin-top:10px">Nodes</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div> Entry (circle)</div>' +
      '<div class="legend-item"><div class="legend-diamond"></div> Tag (diamond)</div>';
    legendEl.innerHTML =
      '<div class="legend-header" id="legend-header">' +
        '<span class="legend-header-label" id="legend-header-label">Legend</span>' +
        '<button type="button" id="legend-toggle" aria-label="Hide legend" title="Hide legend">Hide</button>' +
      '</div>' +
      '<div class="legend-body" id="legend-body">' + legendBodyHtml + '</div>';
    const legendHeader = document.getElementById('legend-header');
    const legendToggle = document.getElementById('legend-toggle');
    const legendHeaderLabel = document.getElementById('legend-header-label');
    function setLegendCollapsed(collapsed) {
      legendEl.classList.toggle('legend-collapsed', collapsed);
      legendToggle.textContent = collapsed ? 'Show' : 'Hide';
      legendToggle.setAttribute('aria-label', collapsed ? 'Show legend' : 'Hide legend');
      legendToggle.title = collapsed ? 'Show legend' : 'Hide legend';
      legendHeaderLabel.textContent = collapsed ? 'Legend · tap to expand' : 'Legend';
    }
    function toggleLegend() {
      setLegendCollapsed(!legendEl.classList.contains('legend-collapsed'));
    }
    legendToggle.addEventListener('click', e => {
      e.stopPropagation();
      toggleLegend();
    });
    legendHeader.addEventListener('click', () => toggleLegend());

    const entryCount = GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').length;
    const tagCount   = GRAPH_DATA.nodes.filter(n => n.node_type === 'tag').length;
    const statsEl = document.getElementById('stats');

    function tagTier(count) {
      if (count <= 1) return 'singleton';
      if (count <= 3) return 'recurring';
      return 'frequent';
    }

    function tagSize(count) {
      if (count <= 1) return 8;
      if (count <= 3) return 14;
      return 18;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function normalizeWs(s) {
      return String(s).replace(/\s+/g, ' ').trim();
    }

    /** Highlight evidence excerpt (strong) and surrounding paragraph (soft) in source text. */
    function highlightSourceText(rawText, excerpt) {
      const text = rawText || '';
      if (!excerpt || !text) return escapeHtml(text);

      const parts = excerpt.split(/\.\.\./).map(p => normalizeWs(p)).filter(Boolean);
      let idx = -1;
      let matchLen = 0;

      for (const part of parts) {
        if (part.length < 12) continue;
        const probe = part.slice(0, Math.min(60, part.length));
        const i = text.indexOf(probe.slice(0, 20));
        if (i >= 0) { idx = i; matchLen = part.length; break; }
        const collapsed = normalizeWs(text);
        const j = collapsed.indexOf(probe.slice(0, 30));
        if (j >= 0) {
          const ratio = j / Math.max(1, collapsed.length);
          idx = Math.floor(ratio * text.length);
          matchLen = Math.min(part.length, text.length - idx);
          break;
        }
      }

      if (idx < 0) return escapeHtml(text);

      const paraStart = Math.max(0, text.lastIndexOf('\n\n', idx));
      const paraEndRaw = text.indexOf('\n\n', idx + matchLen);
      const paraEnd = paraEndRaw >= 0 ? paraEndRaw : text.length;

      const before = text.slice(0, paraStart);
      const softBefore = text.slice(paraStart, idx);
      const strong = text.slice(idx, Math.min(idx + matchLen, text.length));
      const softAfter = text.slice(idx + strong.length, paraEnd);
      const after = text.slice(paraEnd);

      return escapeHtml(before) +
        '<span class="hl-soft">' + escapeHtml(softBefore) + '</span>' +
        '<span class="hl-strong">' + escapeHtml(strong) + '</span>' +
        '<span class="hl-soft">' + escapeHtml(softAfter) + '</span>' +
        escapeHtml(after);
    }

    const MIN_SHAPE_GAP = 44;
    /** Hierarchical cluster pull: primary theme (strong) > secondary theme (weaker) > tags (weakest). */
    const CLUSTER_PULL = { theme: 0.34, secondary: 0.12, tag: 0.05 };
    const CLUSTER_PASSES = 56;

    function nodeCollisionRadius(node) {
      if (node.data('node_type') === 'entry') return 9;
      const size = node.data('size') || 8;
      return size / 2 + 4;
    }

    /** Push overlapping nodes apart until every pair meets MIN_SHAPE_GAP between edges. */
    function enforceMinimumSeparation(cy, minGap, maxPasses) {
      maxPasses = maxPasses || 100;
      const nodes = cy.nodes().toArray();
      for (let pass = 0; pass < maxPasses; pass++) {
        let moved = false;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];
            const pa = a.position();
            const pb = b.position();
            let dx = pb.x - pa.x;
            let dy = pb.y - pa.y;
            let dist = Math.hypot(dx, dy);
            const minDist = nodeCollisionRadius(a) + nodeCollisionRadius(b) + minGap;
            if (dist < 1e-4) {
              const angle = Math.random() * Math.PI * 2;
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              dist = 1;
            }
            if (dist < minDist) {
              const push = (minDist - dist) / 2;
              const ux = dx / dist;
              const uy = dy / dist;
              a.position({ x: pa.x - ux * push, y: pa.y - uy * push });
              b.position({ x: pb.x + ux * push, y: pb.y + uy * push });
              moved = true;
            }
          }
        }
        if (!moved) break;
      }
    }

    function buildSecondaryThemeGroups() {
      const groups = {};
      GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').forEach(n => {
        (n.secondary_themes || []).forEach(st => {
          (groups[st] = groups[st] || []).push(n.id);
        });
      });
      return groups;
    }

    /** Tiered clustering after force layout: theme regions, then secondary affinities, then tag orbit. */
    function applyHierarchicalClustering(cy, themeCenters, secondaryGroups, passes) {
      passes = passes || CLUSTER_PASSES;

      for (let pass = 0; pass < passes; pass++) {
        const fade = 1 - pass / passes;
        const themePull = CLUSTER_PULL.theme * (0.35 + 0.65 * fade);
        const secondaryPull = CLUSTER_PULL.secondary * (0.35 + 0.65 * fade);
        const tagPull = CLUSTER_PULL.tag * (0.35 + 0.65 * fade);

        // Strongest: pull entries toward their primary theme region anchor
        cy.nodes('[node_type = "entry"]').forEach(node => {
          const center = themeCenters[node.data('theme')];
          if (!center) return;
          const p = node.position();
          node.position({
            x: p.x + (center.x - p.x) * themePull,
            y: p.y + (center.y - p.y) * themePull,
          });
        });

        // Weaker: entries sharing a secondary theme drift toward that sub-group centroid
        Object.values(secondaryGroups).forEach(ids => {
          if (ids.length < 2) return;
          const nodes = ids.map(id => cy.getElementById(id)).filter(n => n.nonempty());
          if (nodes.length < 2) return;
          const cx = nodes.reduce((s, n) => s + n.position('x'), 0) / nodes.length;
          const cyPos = nodes.reduce((s, n) => s + n.position('y'), 0) / nodes.length;
          nodes.forEach(node => {
            const p = node.position();
            node.position({
              x: p.x + (cx - p.x) * secondaryPull,
              y: p.y + (cyPos - p.y) * secondaryPull,
            });
          });
        });

        // Weakest: tags orbit just outside their connected entry cluster
        cy.nodes('[node_type = "tag"]').forEach(tag => {
          const entries = tag.neighborhood('node[node_type = "entry"]');
          if (entries.length === 0) return;
          let cx = 0;
          let cyPos = 0;
          entries.forEach(e => { cx += e.position('x'); cyPos += e.position('y'); });
          cx /= entries.length;
          cyPos /= entries.length;

          const theme = entries[0].data('theme');
          const themeAnchor = themeCenters[theme] || { x: cx, y: cyPos };
          let dx = cx - themeAnchor.x;
          let dy = cyPos - themeAnchor.y;
          const len = Math.hypot(dx, dy) || 1;
          dx /= len;
          dy /= len;
          const orbit = 110 + entries.length * 22;
          const targetX = cx + dx * orbit;
          const targetY = cyPos + dy * orbit;

          const p = tag.position();
          tag.position({
            x: p.x + (targetX - p.x) * tagPull,
            y: p.y + (targetY - p.y) * tagPull,
          });
        });

        if (pass % 4 === 3) enforceMinimumSeparation(cy, MIN_SHAPE_GAP, 20);
      }
    }

    function computeThemeCenters(clusters) {
      const n = clusters.length || 1;
      const radius = Math.max(780, n * 240);
      const centers = {};
      clusters.forEach((t, i) => {
        const angle = (2 * Math.PI * i) / n - Math.PI / 2;
        centers[t.id] = { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
      });
      return centers;
    }

    function seedPositions(centers) {
      const positions = {};
      const entriesByTheme = {};
      GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').forEach(n => {
        const th = n.theme || 'unknown';
        (entriesByTheme[th] = entriesByTheme[th] || []).push(n);
      });

      Object.entries(entriesByTheme).forEach(([theme, list]) => {
        const c = centers[theme] || { x: 0, y: 0 };
        list.forEach((n, i) => {
          const angle = (2 * Math.PI * i) / list.length;
          const r = 155 + list.length * 44;
          positions[n.id] = {
            x: c.x + Math.cos(angle) * r,
            y: c.y + Math.sin(angle) * r,
          };
        });
      });

      GRAPH_DATA.nodes.filter(n => n.node_type === 'tag').forEach(tag => {
        const linkedIds = GRAPH_DATA.edges.filter(e => e.target === tag.id).map(e => e.source);
        const linkedPos = linkedIds.map(id => positions[id]).filter(Boolean);
        if (!linkedPos.length) {
          positions[tag.id] = { x: (Math.random() - 0.5) * 300, y: (Math.random() - 0.5) * 300 };
          return;
        }
        const cx = linkedPos.reduce((s, p) => s + p.x, 0) / linkedPos.length;
        const cy = linkedPos.reduce((s, p) => s + p.y, 0) / linkedPos.length;
        const entry = GRAPH_DATA.nodes.find(en => en.id === linkedIds[0]);
        const themeCenter = centers[entry?.theme] || { x: cx, y: cy };
        let dx = cx - themeCenter.x;
        let dy = cy - themeCenter.y;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len;
        dy /= len;
        const spread = (linkedPos.length - 1) * 28;
        const push = 200 + spread;
        positions[tag.id] = {
          x: cx + dx * push + (Math.random() - 0.5) * 60,
          y: cy + dy * push + (Math.random() - 0.5) * 60,
        };
      });

      return positions;
    }

    if (entryCount === 0) {
      statsEl.textContent = 'No ideas yet.';
      document.querySelector('.hint').style.display = 'none';
      legendEl.style.display = 'none';
      document.getElementById('theme-labels').style.display = 'none';
      document.getElementById('cy').insertAdjacentHTML('afterend',
        '<div class="empty-state"><h2>Your idea map is empty</h2>' +
        '<p>Process a diary entry to get started:<br>' +
        '<code>npm run process -- --file entry.txt --title "My Entry"</code></p></div>'
      );
    } else {
      statsEl.textContent = entryCount + ' ideas · ' + tagCount + ' tags · ' + activeThemeIds.size + ' theme regions';

      const themeCenters = computeThemeCenters(GRAPH_DATA.themeClusters);
      const secondaryThemeGroups = buildSecondaryThemeGroups();
      const initialPositions = seedPositions(themeCenters);
      const anchoredPositions = {};

      const elements = [];

      GRAPH_DATA.nodes.filter(n => n.node_type === 'entry').forEach(n => {
        elements.push({ group: 'nodes', data: {
          id: n.id,
          node_type: 'entry',
          color: themeColorMap[n.theme] || '#6e7681',
          theme: n.theme,
          secondary_themes: n.secondary_themes || [],
          tags: n.tags || [],
          core_idea: n.core_idea || '',
          evidence_excerpt: n.evidence_excerpt || '',
          source_id: n.source_id || '',
        }, position: initialPositions[n.id] });
      });

      GRAPH_DATA.nodes.filter(n => n.node_type === 'tag').forEach(n => {
        const tier = tagTier(n.connectionCount);
        elements.push({ group: 'nodes', data: {
          id: n.id,
          label: n.label ? n.label.replace(/_/g, ' ') : n.id.replace(/_/g, ' '),
          node_type: 'tag',
          connectionCount: n.connectionCount,
          tagTier: tier,
          size: tagSize(n.connectionCount),
        }, position: initialPositions[n.id] });
      });

      GRAPH_DATA.edges.forEach(e => {
        elements.push({ group: 'edges', data: { id: e.id, source: e.source, target: e.target } });
      });

      const cy = cytoscape({
        container: document.getElementById('cy'),
        elements,
        minZoom: 0.25,
        maxZoom: 3,
        style: [
          {
            selector: 'node[node_type = "entry"]',
            style: {
              'background-color': 'data(color)',
              'width': 12,
              'height': 12,
              'shape': 'ellipse',
              'label': '',
              'border-width': 1.5,
              'border-color': 'data(color)',
              'border-opacity': 0.5,
              'background-opacity': 0.95,
            }
          },
          {
            selector: 'node[node_type = "entry"]:selected',
            style: {
              'border-width': 2.5,
              'border-opacity': 1,
              'border-color': '#ffffff',
              'width': 14,
              'height': 14,
            }
          },
          {
            selector: 'node[node_type = "tag"]',
            style: {
              'background-color': '#12171f',
              'border-color': '#58a6ff',
              'border-width': 1.5,
              'shape': 'diamond',
              'width': 'data(size)',
              'height': 'data(size)',
              'label': '',
            }
          },
          {
            selector: 'node[node_type = "tag"].show-label',
            style: {
              'label': 'data(label)',
              'font-size': '8px',
              'color': '#b1bac4',
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': 5,
              'text-max-width': '64px',
              'text-outline-color': '#0a0e14',
              'text-outline-width': 2,
            }
          },
          {
            selector: 'node[node_type = "tag"][tagTier = "singleton"]',
            style: {
              'opacity': 0.5,
              'border-width': 1,
            }
          },
          {
            selector: 'node[node_type = "tag"][tagTier = "frequent"]',
            style: {
              'border-width': 2,
              'background-color': '#1a2332',
            }
          },
          {
            selector: 'node[node_type = "tag"].active, node[node_type = "tag"]:selected',
            style: {
              'border-color': '#79c0ff',
              'opacity': 1,
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 1.5,
              'line-color': '#484f58',
              'opacity': 0.38,
              'curve-style': 'bezier',
              'target-arrow-shape': 'none',
            }
          },
          {
            selector: 'edge.emphasized',
            style: {
              'opacity': 0.85,
              'line-color': '#58a6ff',
              'width': 2.5,
            }
          },
          {
            selector: 'node.neighbor-emphasis',
            style: { 'opacity': 1, 'border-opacity': 1 }
          },
          { selector: 'node.dimmed', style: { 'opacity': 0.08 } },
          { selector: 'edge.dimmed', style: { 'opacity': 0.06 } },
        ],
        layout: {
          name: 'cose',
          animate: true,
          animationDuration: 700,
          fit: true,
          padding: 200,
          randomize: false,
          nodeRepulsion: 58000,
          nodeOverlap: 64,
          idealEdgeLength: 270,
          edgeElasticity: 0.22,
          nestingFactor: 1,
          gravity: 0.03,
          numIter: 2000,
        },
      });

      // Show labels only on recurring tags; singletons stay quiet until hover
      cy.nodes('[node_type = "tag"][tagTier != "singleton"]').addClass('show-label');

      const themeLabelsEl = document.getElementById('theme-labels');
      const labelEls = {};
      GRAPH_DATA.themeClusters.forEach(t => {
        const el = document.createElement('div');
        el.className = 'theme-label';
        el.textContent = t.name;
        el.style.color = themeColorMap[t.id] || '#6e7681';
        themeLabelsEl.appendChild(el);
        labelEls[t.id] = el;
      });

      function updateThemeLabels() {
        const buckets = {};
        cy.nodes('[node_type = "entry"]').forEach(n => {
          if (n.hasClass('dimmed')) return;
          const th = n.data('theme');
          if (!buckets[th]) buckets[th] = { x: 0, y: 0, n: 0 };
          const p = n.renderedPosition();
          buckets[th].x += p.x;
          buckets[th].y += p.y;
          buckets[th].n += 1;
        });
        Object.entries(labelEls).forEach(([id, el]) => {
          const b = buckets[id];
          if (!b || b.n === 0) { el.style.display = 'none'; return; }
          el.style.display = 'block';
          el.style.left = (b.x / b.n) + 'px';
          el.style.top = (b.y / b.n) + 'px';
        });
      }

      function saveAnchors() {
        cy.nodes().forEach(n => {
          anchoredPositions[n.id()] = { x: n.position('x'), y: n.position('y') };
        });
      }

      /** Snap a dragged node back to its layout anchor. */
      function snapBack(node) {
        const anchor = anchoredPositions[node.id()];
        if (!anchor) return;
        node.animation(
          { position: { x: anchor.x, y: anchor.y } },
          { duration: 400, easing: 'ease-out-cubic', complete: updateThemeLabels },
        ).play();
      }

      // Seed anchors from preset positions until layout finishes
      Object.entries(initialPositions).forEach(([id, pos]) => {
        anchoredPositions[id] = { x: pos.x, y: pos.y };
      });

      cy.on('layoutstop', () => {
        applyHierarchicalClustering(cy, themeCenters, secondaryThemeGroups);
        enforceMinimumSeparation(cy, MIN_SHAPE_GAP);
        saveAnchors();
        updateThemeLabels();
        cy.fit(120);
      });
      cy.on('pan zoom resize', updateThemeLabels);

      cy.nodes().grabify();

      // Cytoscape fires "free" when a grabbed node is released
      cy.on('free', 'node', evt => {
        snapBack(evt.target);
      });

      const panel = document.getElementById('info-panel');
      const infoTitle = document.getElementById('info-title');
      const infoContent = document.getElementById('info-content');
      const sourceModal = document.getElementById('source-modal');

      function closePanel() { panel.classList.remove('open'); }
      function closeSourceModal() { sourceModal.classList.remove('open'); }

      function openSourceView(entryId) {
        const entryNode = GRAPH_DATA.nodes.find(n => n.id === entryId && n.node_type === 'entry');
        if (!entryNode) return;
        const src = GRAPH_DATA.sources[entryNode.source_id];
        if (!src) return;
        document.getElementById('source-modal-title').textContent = src.title;
        document.getElementById('source-modal-meta').textContent =
          (src.created_at ? src.created_at + ' · ' : '') + entryNode.id;
        document.getElementById('source-modal-body').innerHTML =
          highlightSourceText(src.raw_text, entryNode.evidence_excerpt);
        sourceModal.classList.add('open');
      }

      function showEntryPanel(d) {
        const themeData = GRAPH_DATA.themes.find(t => t.id === d.theme);
        const color = themeColorMap[d.theme] || '#888';
        const src = GRAPH_DATA.sources[d.source_id];
        infoTitle.textContent = d.core_idea || 'Entry';
        infoContent.innerHTML =
          (d.evidence_excerpt
            ? '<div class="info-section"><div class="info-label">Evidence</div>' +
              '<div class="info-value" style="font-style:italic;color:#9da7b3">' +
              escapeHtml(d.evidence_excerpt) + '</div></div>'
            : '') +
          '<div class="info-section"><div class="info-label">Theme</div>' +
            '<div class="info-value"><span class="theme-dot" style="background:' + color + '"></span>' +
            (themeData ? themeData.name : d.theme) + '</div></div>' +
          (d.tags && d.tags.length
            ? '<div class="info-section"><div class="info-label">Tags</div><div class="tag-list">' +
              d.tags.map(t => '<span class="tag">' + t.replace(/_/g, ' ') + '</span>').join('') +
              '</div></div>'
            : '') +
          (src
            ? '<div class="info-section"><div class="info-label">Source</div>' +
              '<div class="info-meta">' + escapeHtml(src.title) +
              (src.created_at ? ' · ' + escapeHtml(src.created_at) : '') + '</div></div>'
            : '') +
          (src
            ? '<button type="button" class="btn-primary" id="view-source-btn" style="width:100%;margin-top:8px">' +
              'View full entry</button>'
            : '');
        panel.classList.add('open');
        const btn = document.getElementById('view-source-btn');
        if (btn) btn.onclick = () => openSourceView(d.id);
      }

      function showTagPanel(tagNode) {
        const d = tagNode.data();
        const connEntries = tagNode.neighborhood('node[node_type = "entry"]');
        infoTitle.textContent = d.label || d.id;
        let html =
          '<div class="info-section"><div class="info-label">Recurring motif</div>' +
          '<div class="info-value">' + d.connectionCount + ' connected entr' +
          (d.connectionCount === 1 ? 'y' : 'ies') + '</div></div>' +
          '<div class="info-section"><div class="info-label">Connected ideas</div>';

        connEntries.forEach(n => {
          const ed = n.data();
          const src = GRAPH_DATA.sources[ed.source_id];
          const snippet = ed.core_idea || ed.evidence_excerpt || '';
          html +=
            '<div class="entry-link" data-entry-id="' + ed.id + '">' +
              '<div class="entry-link-title">' + escapeHtml(src ? src.title : ed.id) + '</div>' +
              '<div class="entry-link-snippet">' + escapeHtml(snippet.slice(0, 160)) +
              (snippet.length > 160 ? '…' : '') + '</div>' +
            '</div>';
        });
        html += '</div>';
        infoContent.innerHTML = html;
        panel.classList.add('open');
        infoContent.querySelectorAll('.entry-link').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.getAttribute('data-entry-id');
            cy.nodes('#' + id).select();
            showEntryPanel(cy.nodes('#' + id).data());
          });
        });
      }

      cy.on('mouseover', 'node', evt => {
        const node = evt.target;
        cy.edges().removeClass('emphasized');
        cy.nodes().removeClass('neighbor-emphasis');
        node.connectedEdges().addClass('emphasized');
        node.neighborhood('node').addClass('neighbor-emphasis');
        if (node.data('node_type') === 'tag') {
          node.addClass('active show-label');
        }
      });
      cy.on('mouseout', 'node', evt => {
        const node = evt.target;
        cy.edges().removeClass('emphasized');
        cy.nodes().removeClass('neighbor-emphasis active');
        if (node.data('node_type') === 'tag' && node.data('tagTier') === 'singleton' && !node.selected()) {
          node.removeClass('show-label');
        }
      });

      cy.on('tap', 'node[node_type = "entry"]', evt => {
        showEntryPanel(evt.target.data());
      });
      cy.on('tap', 'node[node_type = "tag"]', evt => {
        showTagPanel(evt.target);
      });

      cy.on('tap', evt => { if (evt.target === cy) closePanel(); });
      document.getElementById('info-close').addEventListener('click', closePanel);
      document.getElementById('source-modal-close').addEventListener('click', closeSourceModal);
      sourceModal.addEventListener('click', e => {
        if (e.target === sourceModal) closeSourceModal();
      });

      filterEl.addEventListener('change', e => {
        const themeId = e.target.value;
        cy.elements().removeClass('dimmed');
        if (!themeId) { updateThemeLabels(); return; }
        cy.nodes('[node_type = "entry"]').forEach(n => {
          if (n.data('theme') !== themeId) n.addClass('dimmed');
        });
        cy.nodes('[node_type = "tag"]').forEach(n => {
          const anyVisible = n.neighborhood('node[node_type = "entry"]').some(en => !en.hasClass('dimmed'));
          if (!anyVisible) n.addClass('dimmed');
        });
        cy.edges().forEach(ed => {
          if (ed.source().hasClass('dimmed') || ed.target().hasClass('dimmed')) ed.addClass('dimmed');
        });
        updateThemeLabels();
      });

      document.getElementById('reset-btn').addEventListener('click', () => {
        cy.elements().removeClass('dimmed');
        filterEl.value = '';
        updateThemeLabels();
      });
      document.getElementById('fit-btn').addEventListener('click', () => {
        cy.fit(80);
        updateThemeLabels();
      });
    }
  </script>
</body>
</html>
