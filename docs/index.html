<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Map</title>
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    #cy { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    #theme-labels {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2; overflow: hidden;
    }
    .theme-label {
      position: absolute; transform: translate(-50%, -100%);
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
      text-align: center; max-width: 180px; line-height: 1.3;
      opacity: 0.55; white-space: normal;
      text-shadow: 0 0 20px rgba(10, 14, 20, 0.98), 0 1px 3px rgba(0,0,0,0.9);
      margin-top: -36px;
    }

    #controls {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
    }
    #controls h1 { font-size: 20px; font-weight: 700; color: #58a6ff; letter-spacing: -0.3px; }
    #stats { font-size: 12px; color: #8b949e; }
    .control-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    select, button {
      background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    select:focus, button:hover { border-color: #58a6ff; outline: none; }
    .btn-primary { background: #1f3a5f; border-color: #388bfd; color: #e6edf3; }
    .btn-primary:hover { background: #264a7a; }

    #info-panel {
      position: fixed; right: 0; top: 0; width: 340px; height: 100vh;
      background: #161b22; border-left: 1px solid #30363d;
      padding: 24px 20px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.22s ease; z-index: 10;
    }
    #info-panel.open { transform: translateX(0); }
    #info-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; color: #8b949e;
      font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    #info-close:hover { color: #c9d1d9; }
    #info-panel h2 { font-size: 15px; color: #e6edf3; margin-bottom: 16px; padding-right: 28px; line-height: 1.45; font-weight: 600; }
    .info-section { margin-bottom: 16px; }
    .info-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #8b949e; margin-bottom: 5px; }
    .info-value { font-size: 13px; color: #c9d1d9; line-height: 1.55; }
    .info-meta { font-size: 12px; color: #8b949e; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .tag {
      background: #21262d; border: 1px solid #30363d; border-radius: 4px;
      padding: 3px 8px; font-size: 11px; color: #8b949e; cursor: default;
    }
    .tag.clickable { cursor: pointer; }
    .tag.clickable:hover { border-color: #58a6ff; color: #c9d1d9; }
    .theme-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

    .entry-link {
      display: block; padding: 10px 12px; margin-bottom: 8px;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      cursor: pointer; text-decoration: none; color: inherit;
    }
    .entry-link:hover { border-color: #58a6ff; }
    .entry-link-title { font-size: 12px; color: #58a6ff; margin-bottom: 4px; }
    .entry-link-snippet { font-size: 12px; color: #8b949e; line-height: 1.45; }

    .legend {
      position: fixed; bottom: 16px; left: 16px; z-index: 11;
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 0; max-height: 220px; overflow: hidden;
      min-width: 160px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .legend.legend-collapsed { max-height: none; }
    .legend-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px 8px 12px; border-bottom: 1px solid #30363d;
    }
    .legend.legend-collapsed .legend-header {
      border-bottom: none; padding: 8px 10px; cursor: pointer;
    }
    .legend.legend-collapsed .legend-header:hover { background: #1c2128; }
    .legend-header-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
      color: #8b949e; font-weight: 600;
    }
    #legend-toggle {
      background: #1f3a5f; border: 1px solid #388bfd; color: #e6edf3;
      font-size: 11px; font-weight: 600; line-height: 1;
      padding: 6px 10px; cursor: pointer; border-radius: 5px;
      min-width: 44px; min-height: 32px; flex-shrink: 0;
    }
    #legend-toggle:hover { background: #264a7a; border-color: #58a6ff; }
    .legend-body { padding: 12px 16px; overflow-y: auto; max-height: 180px; }
    .legend.legend-collapsed .legend-body { display: none; }
    .legend-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #8b949e; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #c9d1d9; margin-bottom: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-diamond {
      width: 10px; height: 10px; background: #161b22; border: 1px solid #58a6ff;
      transform: rotate(45deg); flex-shrink: 0;
    }

    .hint {
      position: fixed; bottom: 16px; right: 16px; z-index: 10;
      font-size: 11px; color: #6e7681; text-align: right; line-height: 1.65;
    }
    .empty-state {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #8b949e; z-index: 10;
    }
    .empty-state h2 { font-size: 18px; color: #58a6ff; margin-bottom: 8px; }
    .empty-state p { font-size: 13px; line-height: 1.6; }
    code { background: #21262d; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }

    #source-modal {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.65); align-items: center; justify-content: center; padding: 24px;
    }
    #source-modal.open { display: flex; }
    #source-modal-inner {
      background: #161b22; border: 1px solid #30363d; border-radius: 10px;
      max-width: 720px; width: 100%; max-height: 85vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    #source-modal-header {
      padding: 16px 20px; border-bottom: 1px solid #30363d;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    #source-modal-header h3 { font-size: 16px; color: #e6edf3; font-weight: 600; }
    #source-modal-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
    #source-modal-close { background: none; border: none; color: #8b949e; font-size: 24px; cursor: pointer; line-height: 1; }
    #source-modal-body {
      padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.65; color: #c9d1d9;
      white-space: pre-wrap; font-family: Georgia, 'Times New Roman', serif;
    }
    #tag-tooltip {
      display: none; position: fixed; z-index: 15; pointer-events: none;
      background: #161b22; border: 1px solid #388bfd; border-radius: 5px;
      padding: 4px 8px; font-size: 11px; color: #dce4ec;
      transform: translate(-50%, -120%);
      white-space: nowrap;
    }
  </style>
</head>

  <div class="legend" id="legend"></div>

  <script>
    const GRAPH_DATA = {"nodes":[{"id":"entry_001","label":"","node_type":"entry","theme":"identity","secondary_themes":["emotions","values"],"tags":["self_discovery","fear_of_rejection","vulnerability","authenticity"],"core_idea":"The narrator reflects on self-identity through the lens of what they are not, revealing a deep fear of rejection and a struggle with honesty and authenticity, while tracing these feelings back to childhood experiences and the desire to live a genuine life.","evidence_excerpt":"I’m not honest, but I try my best to be genuine... I think the main, or perhaps only reason people lie is because they’re afraid... Maybe I’m afraid of being dropped, of people finding out that I’m some sort of failure... Those moments when I returned home with a bad grade and had to then endure hours of being shouted at... I think I like this answer to this prompt. I am not an ostrich.","source_id":"source_001","connectionCount":4},{"id":"entry_002","label":"","node_type":"entry","theme":"identity","secondary_themes":["emotions","values"],"tags":["self_discovery","disillusionment","existential_questioning"],"core_idea":"The narrator reflects on a personal identity transition marked by the end of a chapter defined by resilience, anger, and coping mechanisms, now replaced by emptiness, coldness, and existential questioning.","evidence_excerpt":"I had been closing a chapter in my life. One written by wanting to be myself in a world that seemed perversely interested in finding ways to kick me down... I felt empty, hopelessly weighed down by all these self-made structures that no one could understand. The driving force of anger had burned to nothing, leaving me cold. Why was I here? Who was to blame? I hated it all.","source_id":"source_002","connectionCount":3},{"id":"entry_004","label":"","node_type":"entry","theme":"relationships","secondary_themes":["emotions"],"tags":["vulnerability","communication"],"core_idea":"The narrator explores relational dynamics through intimate conversation about empathy, sympathy, and vulnerability, reflecting on the difficulties of truly connecting and the desire to alleviate isolation.","evidence_excerpt":"We had talked about empathy and sympathy... To understand one person IS to sympathize with them!... I explained that to understand doesn’t mean that you sympathize... Yet we can hate ourselves... Because then no one would have to feel hopelessly isolated.","source_id":"source_002","connectionCount":2},{"id":"entry_003","label":"","node_type":"entry","theme":"philosophy","secondary_themes":["values","emotions"],"tags":["existential_questioning","purpose","moral_idealism"],"core_idea":"The narrator reflects on a persistent, intimate internal dialogue with an existential question that has accompanied them for over a decade, driving deep philosophical inquiry about life’s meaning, purpose, and the value of existence, shaping their worldview and moral understanding over time.","evidence_excerpt":"I wonder if there has been a single day in the past decade where you have not taken up at least some corner of my thoughts... One frenchman even said “There is only one really serious philosophical question, and that is suicide.” ... Remember that time when I thought that life was about what you can leave behind?... I really did read too much fantasy back in the day... I had a stage where I thought life was about hope ...","source_id":"source_003","connectionCount":3},{"id":"entry_005","label":"","node_type":"entry","theme":"identity","secondary_themes":["observations"],"tags":["self_discovery","mind_over_matter","perception"],"core_idea":"Individual identity and reality are fundamentally shaped by one’s thoughts and perceptions, meaning each person creates their own internal world that defines their sense of self and how they interpret the external world.","evidence_excerpt":"The person is defined by what they think and why they think it. ... As an extension of this thought, it would be fair to think that the idea is the world. The world is defined by what we think regardless of how the world itself is arranged. ... Every mind is a world for the world is in the eyes of the beholder.","source_id":"source_004","connectionCount":3},{"id":"entry_006","label":"","node_type":"entry","theme":"identity","secondary_themes":[],"tags":["self_discovery","vulnerability","authenticity"],"core_idea":"The narrator reflects on the profound challenge of truly expressing their unique inner world through language and art, revealing a deep yearning to be genuinely known and to understand others beyond superficial interactions.","evidence_excerpt":"'How limited our means to do this. All language and art can't cover our whole existence. For my thoughts create a world, and your thoughts your world... I want to be known. I do so very want to be seen. I do so very want to see.'","source_id":"source_005","connectionCount":3},{"id":"entry_007","label":"","node_type":"entry","theme":"identity","secondary_themes":["philosophy"],"tags":["self_discovery","existential_questioning","concealment"],"core_idea":"The narrator contemplates the paradoxical nature of identity as an inescapable, infinite loop full of hidden depths and personal veils, expressing both familiarity and fear toward their own complex self.","evidence_excerpt":"Identity, the greatest lie of all. How can I see me from outside myself, when trying to get out leads me back to myself. To try and look at yourself is trying to escape the mobius strip by walking along it. Identity is an infinite trap... I know myself better than I know anybody, and the infinite alleys and curtains that branch and veil. I am afraid of the dark paths, that is why I have drawn curtains over them... Yet who but I can call myself by my own highest name? Who else can tread along these winding roads that split and crack and still comfortably call it home?","source_id":"source_006","connectionCount":3},{"id":"entry_008","label":"","node_type":"entry","theme":"creativity","secondary_themes":["learning"],"tags":["inspiration","aesthetics","skill_building"],"core_idea":"The narrator uses the metaphor of learning to depict the creative process as a journey of discovery, refinement, and striving for shared understanding through art, emphasizing the aesthetic sensibility and gradual mastery involved.","evidence_excerpt":"Imagine a time before art where a person stumbled upon a brick... They decided this moment... started about capturing it... Then about how there seems to be a line of light on the edge of the darkest edges... One day as he is doing this someone will stop him and say ‘that’s not quite how a brick looks’. It is in this moment that the gap has been closed.","source_id":"source_007","connectionCount":3},{"id":"entry_009","label":"","node_type":"entry","theme":"observations","secondary_themes":["philosophy"],"tags":["culture","social_systems","malleability"],"core_idea":"The essay presents society as an artificial and malleable construction without absolute truths, emphasizing that social morals and systems are human-made and can be changed through conscious understanding.","evidence_excerpt":"Society is a construction. By a construction I mean to say that it carries two important qualities: it is artificial, and it is malleable. Society, being artificial, has no hard and fast truths; no absolute values. So all our morals, justice, and freedoms are all just constructs built on abstract nothings. So all of society is malleable, and nothing that is has to be that way. We can change it.","source_id":"source_008","connectionCount":3},{"id":"entry_010","label":"","node_type":"entry","theme":"observations","secondary_themes":["philosophy"],"tags":["technology","systemic_critique","meta_understanding"],"core_idea":"The narrative critiques modern societal pathologies such as bureaucratic complexity, loss of solid moralities, and attention marketization, advocating for systemic awareness and meta-understanding to better see and interact with the complex systems shaping our world.","evidence_excerpt":"The progress of science and economy has brought us this far ... But now the themes of the day are a loss of solid moralities, near kafkaesque nightmares of bureaucracy, and marketization of our own attention... The problem is that we need to figure out how to see and interact with the systems that make up our world.","source_id":"source_008","connectionCount":3},{"id":"entry_011","label":"","node_type":"entry","theme":"philosophy","secondary_themes":["values"],"tags":["culture","meta_game","society_building"],"core_idea":"The essay argues for the importance of understanding and engaging in society-building as a meta-game, learning the hidden rules, cultural narratives, and strategic moves that shape social structures to meaningfully influence and better the world.","evidence_excerpt":"The full meta-game comes in when we go into society building. In the creation of societies there are moves that we can make, the creation of cultural heroes and villains, a central narrative, celebrations... Society and its beliefs have building blocks.","source_id":"source_008","connectionCount":3},{"id":"entry_012","label":"","node_type":"entry","theme":"emotions","secondary_themes":["relationships"],"tags":["loneliness","trust"],"core_idea":"Understanding loneliness and pain comes from personal emotional experience, while reaching out to others expresses relational empathy and shared human connection.","evidence_excerpt":"Those who know loneliness are the ones who will understand what it means to be lonely. The ones who reach out to help others are the ones who know pain. ... Perhaps that’s where we can see hope.","source_id":"source_009","connectionCount":2},{"id":"entry_014","label":"","node_type":"entry","theme":"emotions","secondary_themes":["philosophy"],"tags":["emotional_renewal","existential_questioning","time"],"core_idea":"The narrator reflects on emotional disengagement and indifference as a slow decay of meaningful experience, illustrating how this emotional fatigue dulls perception of time and effort, while also grappling with existential awareness of living life fully in the present moment.","evidence_excerpt":"When indifference settles, it settles like dust. Filling the grooves of effort painfully etched with the minutes, dulling their edges... All is slow and time quite immeasurable so that the seconds fade into minutes, and the minutes somehow to days... Life is now. Life is here.","source_id":"source_011","connectionCount":3},{"id":"entry_015","label":"","node_type":"entry","theme":"emotions","secondary_themes":["philosophy","identity"],"tags":["emotional_renewal","existential_questioning","self_discovery"],"core_idea":"The narrator experiences emotional fatigue and existential doubt while grappling with philosophical ideas and personal introspection, highlighting an internal struggle with motivation, meaning, and emotional renewal.","evidence_excerpt":"It sometimes feels like the reward for having a dream is doubt and poor sleep...Nietzche’s eternal recurrence, Sartre’s good faith, Camus’ absurd hero...My mind suddenly prompted...slowly turning into sludge from the accumulation of the everyday annoyances and vapid thoughts","source_id":"source_012","connectionCount":3},{"id":"entry_016","label":"","node_type":"entry","theme":"identity","secondary_themes":["goals","emotions"],"tags":["self_discovery","motivation"],"core_idea":"The narrator struggles with self-discipline, motivation, and self-imposed pressures to act, reflecting deeply on personal agency, the construction of internal barriers, and conflicting emotions about progress and worth.","evidence_excerpt":"I remember my journal entries for the last few years, demanding action, constructing this weird prison around myself to try and leave me no choice but to keep acting...Then am I the master or the slave? And how have I done so little?","source_id":"source_012","connectionCount":2},{"id":"entry_013","label":"","node_type":"entry","theme":"identity","secondary_themes":["philosophy"],"tags":["self_discovery","existential_questioning","time","growth_mindset"],"core_idea":"The narrator reflects on the fluid nature of time and its deep connection to self-identity and personal growth, using temporal markers to grasp change and acknowledging past beliefs about others' care as filtered through personal experience.","evidence_excerpt":"It’s almost been a year. I think it’s odd that we mark the passage of time so much when time itself seems like a continuous concept that keeps flowing on... Time is tied to our ideas of change. Identity is a tricky thing to define, and so we look at makers- the days, the weeks, the years- in an attempt to grasp at what feels ungraspable... I hold little belief in the illusion that you would care about me at all. There are undercurrents of my past in this belief, as people seem to have a knack of not caring about me.","source_id":"source_010","connectionCount":4},{"id":"entry_017","label":"","node_type":"entry","theme":"relationships","secondary_themes":["emotions"],"tags":["trust","vulnerability","fear_of_rejection","disillusionment"],"core_idea":"The narrator grapples with relational distance, hope, and pain in connection with another person, expressing longing for understanding while confronting past wounds, intentional disconnection, and vulnerability in relationship dynamics.","evidence_excerpt":"Part of me hopes that you are still lost because maybe then there would be something to talk about, something both of us can relate to... I do not have the perspective to appreciate your answer... it was me who decided to raze even whatever hope we had to building a bridge between us... I wanted the cut... to be absolute.","source_id":"source_010","connectionCount":4},{"id":"skill_building","label":"skill-building","node_type":"tag","connectionCount":1},{"id":"authenticity","label":"authenticity","node_type":"tag","connectionCount":2},{"id":"growth_mindset","label":"growth-mindset","node_type":"tag","connectionCount":1},{"id":"vulnerability","label":"vulnerability","node_type":"tag","connectionCount":4},{"id":"self_discovery","label":"self-discovery","node_type":"tag","connectionCount":8},{"id":"concealment","label":"concealment","node_type":"tag","connectionCount":1},{"id":"fear_of_rejection","label":"fear-of-rejection","node_type":"tag","connectionCount":2},{"id":"trust","label":"trust","node_type":"tag","connectionCount":2},{"id":"communication","label":"communication","node_type":"tag","connectionCount":1},{"id":"loneliness","label":"loneliness","node_type":"tag","connectionCount":1},{"id":"inspiration","label":"inspiration","node_type":"tag","connectionCount":1},{"id":"aesthetics","label":"aesthetics","node_type":"tag","connectionCount":1},{"id":"purpose","label":"purpose","node_type":"tag","connectionCount":1},{"id":"motivation","label":"motivation","node_type":"tag","connectionCount":1},{"id":"emotional_renewal","label":"emotional-renewal","node_type":"tag","connectionCount":2},{"id":"existential_questioning","label":"existential-questioning","node_type":"tag","connectionCount":6},{"id":"moral_idealism","label":"moral-idealism","node_type":"tag","connectionCount":1},{"id":"disillusionment","label":"disillusionment","node_type":"tag","connectionCount":2},{"id":"time","label":"time","node_type":"tag","connectionCount":2},{"id":"technology","label":"technology","node_type":"tag","connectionCount":1},{"id":"culture","label":"culture","node_type":"tag","connectionCount":2},{"id":"mind_over_matter","label":"mind over matter","node_type":"tag","connectionCount":1},{"id":"perception","label":"perception","node_type":"tag","connectionCount":1},{"id":"social_systems","label":"social systems","node_type":"tag","connectionCount":1},{"id":"malleability","label":"malleability","node_type":"tag","connectionCount":1},{"id":"systemic_critique","label":"systemic critique","node_type":"tag","connectionCount":1
