<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Map</title>
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    #cy { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    #theme-labels {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2; overflow: hidden;
    }
    .theme-label {
      position: absolute; transform: translate(-50%, -100%);
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
      text-align: center; max-width: 180px; line-height: 1.3;
      opacity: 0.55; white-space: normal;
      text-shadow: 0 0 20px rgba(10, 14, 20, 0.98), 0 1px 3px rgba(0,0,0,0.9);
      margin-top: -36px;
    }

    #controls {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
    }
    #controls h1 { font-size: 20px; font-weight: 700; color: #58a6ff; letter-spacing: -0.3px; }
    #stats { font-size: 12px; color: #8b949e; }
    .control-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    select, button {
      background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    select:focus, button:hover { border-color: #58a6ff; outline: none; }
    .btn-primary { background: #1f3a5f; border-color: #388bfd; color: #e6edf3; }
    .btn-primary:hover { background: #264a7a; }

    #info-panel {
      position: fixed; right: 0; top: 0; width: 340px; height: 100vh;
      background: #161b22; border-left: 1px solid #30363d;
      padding: 24px 20px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.22s ease; z-index: 10;
    }
    #info-panel.open { transform: translateX(0); }
    #info-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; color: #8b949e;
      font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    #info-close:hover { color: #c9d1d9; }
    #info-panel h2 { font-size: 15px; color: #e6edf3; margin-bottom: 16px; padding-right: 28px; line-height: 1.45; font-weight: 600; }
    .info-section { margin-bottom: 16px; }
    .info-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #8b949e; margin-bottom: 5px; }
    .info-value { font-size: 13px; color: #c9d1d9; line-height: 1.55; }
    .info-meta { font-size: 12px; color: #8b949e; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .tag {
      background: #21262d; border: 1px solid #30363d; border-radius: 4px;
      padding: 3px 8px; font-size: 11px; color: #8b949e; cursor: default;
    }
    .tag.clickable { cursor: pointer; }
    .tag.clickable:hover { border-color: #58a6ff; color: #c9d1d9; }
    .theme-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

    .entry-link {
      display: block; padding: 10px 12px; margin-bottom: 8px;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      cursor: pointer; text-decoration: none; color: inherit;
    }
    .entry-link:hover { border-color: #58a6ff; }
    .entry-link-title { font-size: 12px; color: #58a6ff; margin-bottom: 4px; }
    .entry-link-snippet { font-size: 12px; color: #8b949e; line-height: 1.45; }

    .legend {
      position: fixed; bottom: 16px; left: 16px; z-index: 11;
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 0; max-height: 220px; overflow: hidden;
      min-width: 160px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .legend.legend-collapsed { max-height: none; }
    .legend-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px 8px 12px; border-bottom: 1px solid #30363d;
    }
    .legend.legend-collapsed .legend-header {
      border-bottom: none; padding: 8px 10px; cursor: pointer;
    }
    .legend.legend-collapsed .legend-header:hover { background: #1c2128; }
    .legend-header-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
      color: #8b949e; font-weight: 600;
    }
    #legend-toggle {
      background: #1f3a5f; border: 1px solid #388bfd; color: #e6edf3;
      font-size: 11px; font-weight: 600; line-height: 1;
      padding: 6px 10px; cursor: pointer; border-radius: 5px;
      min-width: 44px; min-height: 32px; flex-shrink: 0;
    }
    #legend-toggle:hover { background: #264a7a; border-color: #58a6ff; }
    .legend-body { padding: 12px 16px; overflow-y: auto; max-height: 180px; }
    .legend.legend-collapsed .legend-body { display: none; }
    .legend-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #8b949e; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #c9d1d9; margin-bottom: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-diamond {
      width: 10px; height: 10px; background: #161b22; border: 1px solid #58a6ff;
      transform: rotate(45deg); flex-shrink: 0;
    }

    .hint {
      position: fixed; bottom: 16px; right: 16px; z-index: 10;
      font-size: 11px; color: #6e7681; text-align: right; line-height: 1.65;
    }
    .empty-state {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #8b949e; z-index: 10;
    }
    .empty-state h2 { font-size: 18px; color: #58a6ff; margin-bottom: 8px; }
    .empty-state p { font-size: 13px; line-height: 1.6; }
    code { background: #21262d; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }

    #source-modal {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.65); align-items: center; justify-content: center; padding: 24px;
    }
    #source-modal.open { display: flex; }
    #source-modal-inner {
      background: #161b22; border: 1px solid #30363d; border-radius: 10px;
      max-width: 720px; width: 100%; max-height: 85vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    #source-modal-header {
      padding: 16px 20px; border-bottom: 1px solid #30363d;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    #source-modal-header h3 { font-size: 16px; color: #e6edf3; font-weight: 600; }
    #source-modal-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
    #source-modal-close { background: none; border: none; color: #8b949e; font-size: 24px; cursor: pointer; line-height: 1; }
    #source-modal-body {
      padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.65; color: #c9d1d9;
      white-space: pre-wrap; font-family: Georgia, 'Times New Roman', serif;
    }
    #tag-tooltip {
      display: none; position: fixed; z-index: 15; pointer-events: none;
      background: #161b22; border: 1px solid #388bfd; border-radius: 5px;
      padding: 4px 8px; font-size: 11px; color: #dce4ec;
      transform: translate(-50%, -120%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="controls">

    <div class="control-row">
      <select id="theme-filter"><option value="">All themes</option></select>
      <button id="reset-btn">Reset</button>
      <button id="fit-btn">Fit</button>
    </div>
  </div>

  <div id="info-panel">
    <button id="info-close">×</button>
    <h2 id="info-title"></h2>
    <div id="info-content"></div>

  <div id="source-modal">

      <div id="source-modal-header">

          <h3 id="source-modal-title"></h3>
          <div id="source-modal-meta"></div>
        </div>
        <button id="source-modal-close" type="button">×</button>
      </div>
      <div id="source-modal-body"></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="hint">○ ideas · ◇ tags (hover for name) · drag to inspect<br>Click for details · scroll to zoom</div>

  <script>
    const GRAPH_DATA = {"nodes":[{"id":"entry_001","label":"","node_type":"entry","theme":"emotions","secondary_themes":["creativity","self_control"],"tags":["inner_conflict","creative_process","self_control","existential_doubt"],"core_idea":"The narrator experiences a complex internal struggle involving emotional doubt, creative frustration, and questions about self-discipline while working on a challenging technical project.","evidence_excerpt":"I sat there, staring at the screen, a million little puzzles filling my head... I feel the old arguments rise, slowly swirling in the background noise of my mind... You’re creating a virtual reality experience that forms a useful tool... Some random snippet of something I read years ago flits across my mind, asking me how one can have self discipline if one is beating oneself into submission.","source_id":"source_001","connectionCount":4},{"id":"entry_002","label":"","node_type":"entry","theme":"creativity","secondary_themes":["emotions","technology"],"tags":["creative_process","innovation","inner_conflict"],"core_idea":"The author is designing a new XR activity that balances playfulness and moments of vulnerability to foster meaningful connection, while also aiming for quick, impactful understanding and technical innovation within a personal, achievable project scope.","evidence_excerpt":"I want to give people a chance to be ‘playful’. But also I want moments where vulnerability is needed. Some way to connect. Not TOO deep, but deep enough. One moment in time...I need a ‘clever’ thing I can make as a weekend project. I need to create something new, that’s not been tried in XR...The impact should be front loaded. People should understand the ‘sell’ as fast as possible.","source_id":"source_002","connectionCount":3},{"id":"entry_003","label":"","node_type":"entry","theme":"culture","secondary_themes":["observations"],"tags":["social_roles","culture"],"core_idea":"The writer explores how culture emerges within small groups, including the role of hierarchy and specialized roles in forming shared mythologies and social structures, using MMO gaming roles as an analogy.","evidence_excerpt":"There must be a way that culture is created, even if it’s just between ten people. Especially if I give groups of three and then one ‘king’. But this is introducing hierarchy already. But this is also kind of how close range DPS, healer, tanker, long range DPS works in MMOs. As long as roles exist, mythology around these roles crystalize.","source_id":"source_003","connectionCount":2},{"id":"entry_004","label":"","node_type":"entry","theme":"emotions","secondary_themes":["identity"],"tags":["inner_conflict","existential_doubt","self_control"],"core_idea":"The narrator reflects on a day of emotional struggle, inner conflict, and existential doubt while also considering self-identity and personal growth amid feelings of despair and resilience.","evidence_excerpt":"My mind was hopelessly scattered now. We had talked about empathy and sympathy. ... I started jogging. There was also a laughably convoluted conversation about how cutting carbs would free me from being dictated by hunger. I had been closing a chapter in my life. One written by wanting to be myself in a world that seemed perversely interested in finding ways to kick me down. ... The driving force of anger had burned to nothing, leaving me cold. I hated it all.","source_id":"source_004","connectionCount":3},{"id":"entry_005","label":"","node_type":"entry","theme":"emotions","secondary_themes":["philosophy"],"tags":["inner_conflict","existential_doubt"],"core_idea":"The narrator experiences a deep emotional struggle with time slipping away indifferently, leading to feelings of loss of meaning, waning desire, and existential doubt about what one truly wants.","evidence_excerpt":"It seems to have something to do with attention and want. When one wants something you measure the time pass by one tick at a time...But when indifference settles, it settles like dust...There is no divinity that guides my hand, and so I am utterly alone...So then it becomes a problem of what I want. How does a person ever know what they want?","source_id":"source_005","connectionCount":2},{"id":"entry_006","label":"","node_type":"entry","theme":"identity","secondary_themes":["observations"],"tags":["perception","subjective_reality"],"core_idea":"Individuals each live in their own subjective world shaped by their perceptions and thoughts, which means that personal realities vary greatly and others' significance or perceptions may differ from one's own assumptions.","evidence_excerpt":"As an extension of this thought, it would be fair to think that the idea is the world. The world is defined by what we think regardless of how the world itself is arranged... Every mind is a world for the world is in the eyes of the beholder. Doesn't this worry you sometimes? What if that one person you thought was nice to you actually just thought nothing of you?... The world is acting on you, but at the same time you are acting on the world.","source_id":"source_006","connectionCount":2},{"id":"entry_007","label":"","node_type":"entry","theme":"identity","secondary_themes":["self_understanding"],"tags":["inner_conflict","perception","subjective_reality"],"core_idea":"The narrator meditates on the paradoxical and recursive nature of identity as an inescapable, self-referential trap.","evidence_excerpt":"Identity, the greatest lie of all. How can I see me from outside myself, when trying to get out leads me back to myself. To try and look at yourself is trying to escape the mobius strip by walking along it. Identity is an infinite trap.","source_id":"source_008","connectionCount":3},{"id":"entry_008","label":"","node_type":"entry","theme":"emotions","secondary_themes":["identity"],"tags":["inner_conflict"],"core_idea":"A child struggles with intense emotional pain and frustration from feeling unheard and powerless within a hostile family environment, desperately seeking validation and understanding.","evidence_excerpt":"He just wanted to be heard. His anger boiling over to rage... If only he could TALK. If only he could be heard in this hellhole of a place.","source_id":"source_011","connectionCount":1},{"id":"entry_009","label":"","node_type":"entry","theme":"technology","secondary_themes":[],"tags":["body_representation","user_experience"],"core_idea":"Current VR systems track only the head and hands, leading to imprecise body representation and unique perception challenges in virtual environments.","evidence_excerpt":"In VR, your head is usually used as a point of reference as to where your character’s location actually is. This can lead to some oddly tricky situations where you’re peeking over a cliff or around a corner, but your whole body is moved. The game engine can’t really tell the difference between these as long as only the head and hands are tracked.","source_id":"source_012","connectionCount":2},{"id":"entry_010","label":"","node_type":"entry","theme":"technology","secondary_themes":["emotions"],"tags":["haptic_feedback","interaction_design"],"core_idea":"The lack of tactile feedback and precise hand movement tracking in current VR input schemes limits natural interaction and causes frustration with tasks requiring fine motor skills.","evidence_excerpt":"In real life, we actually require extremely precise movements from our hands very frequently...The lack of weight and acceleration of objects is also why throwing objects in VR usually feels terrible...these signals are missing in current control schemes.","source_id":"source_012","connectionCount":2},{"id":"entry_011","label":"","node_type":"entry","theme":"creativity","secondary_themes":["technology"],"tags":["interaction_design"],"core_idea":"Creative VR interaction designs, like gesture controls, virtual magic spells, and reimagined body mechanics, expand human-computer interaction by inventing new forms of embodied expression.","evidence_excerpt":"VR games like Waltz of the Wizard or Rumble create new 'languages' of gestures and interactions...Reworking body roles, like Gorilla Tag’s arm-as-legs, explores more intuitive forms of movement.","source_id":"source_012","connectionCount":1},{"id":"entry_012","label":"","node_type":"entry","theme":"learning","secondary_themes":["values"],"tags":["reading_habits","literary_expansion","personal_growth"],"core_idea":"The writer reflects on their evolving journey with reading, from enjoying light entertainment fiction in youth to discovering the deeper insight and challenge found in classics and more difficult literature, emphasizing how books broaden horizons and enrich life beyond mere amusement.","evidence_excerpt":"I was an avid reader during my adolescent years... I tried my hand at the classics... It was kinda great, and that surprised me... Books are treasure troves... repositories of experience that people have put together... There's so much more to life, and books are treasure troves... This is why I always try to see if I can get people to read more difficult books, and it's why I try to read more difficult books (and I have a long way to go).","source_id":"source_013","connectionCount":3},{"id":"entry_013","label":"","node_type":"entry","theme":"values","secondary_themes":["emotions"],"tags":["literature_value","book_interpretation","depth_of_content"],"core_idea":"The writer critiques the superficial tendency to read only for entertainment and argues for appreciating books as profound conveyors of life, beliefs, and experience, whose difficulty reflects the complexity of sharing meaningful human insights rather than a status symbol.","evidence_excerpt":"Books are about life, and experiences, and beliefs... the sharing of life and ideas that should be considered... I would never look down on people who are still reading for entertainment... There’s a deep frustration... when someone argues it has equal merit as heavy literature... it's NOT the difficulty and the 'status'... but the sharing of life and ideas that should be considered.","source_id":"source_013","connectionCount":3},{"id":"entry_014","label":"","node_type":"entry","theme":"emotions","secondary_themes":["values"],"tags":["empathy","hope"],"core_idea":"The writing reflects on how experiencing loneliness and pain fosters empathy and compassionate understanding of others' suffering.","evidence_excerpt":"Those who know loneliness are the ones who will understand what it means to be lonely. The ones who reach out to help others are the ones who know pain.","source_id":"source_014","connectionCount":2},{"id":"entry_015","label":"","node_type":"entry","theme":"society","secondary_themes":["culture","philosophy"],"tags":["social_roles","cultural_formation","systemic_thinking"],"core_idea":"Society is an artificial and malleable construction without absolute truths, shaped by historical narratives and systemic structures that influence collective behavior and individual agency.","evidence_excerpt":"Society is constructed. No, that isn’t quite true...it carries two important qualities: it is artificial, and it is malleable...the Age of Enlightenment...we distanced ourselves from the monarchies...created narratives around personal freedoms...Society and its beliefs have building blocks...creation of cultural heroes and villains, a central narrative, celebrations.","source_id":"source_015","connectionCount":3},{"id":"entry_016","label":"","node_type":"entry","theme":"emotions","secondary_themes":["identity"],"tags":["inner_conflict","existential_doubt","self_control"],"core_idea":"The author reflects on their tendency to lie as stemming from underlying fear of rejection, being exposed as a fraud, and fear of reality, highlighting a deep internal emotional struggle with honesty and authenticity.","evidence_excerpt":"I think the main, or perhaps only reason people lie is because they’re afraid... I’m afraid of rejection, of being found out for the fraud that they think they are, afraid of reality.","source_id":"source_016","connectionCount":3},{"id":"entry_017","label":"","node_type":"entry","theme":"identity","secondary_themes":["emotions","culture"],"tags":["inner_conflict","creative_process"],"core_idea":"The narrator meditates on the challenges of expressing personal identity and inner worlds through language and art, highlighting the emotional longing for genuine connection despite the limitations of communication.","evidence_excerpt":"All language and art can't cover our whole existence. For my thoughts create a world, and your thoughts your world... I do so very want to be seen. I do so very want to see.","source_id":"source_017","connectionCount":2},{"id":"inner_conflict","label":"inner conflict","node_type":"tag","connectionCount":8},{"id":"creative_process","label":"creative process","node_type":"tag","connectionCount":3},{"id":"self_control","label":"self control","node_type":"tag","connectionCount":3},{"id":"existential_doubt","label":"existential doubt","node_type":"tag","connectionCount":4},{"id":"innovation","label":"innovation","node_type":"tag","connectionCount":1},{"id":"social_roles","label":"social roles","node_type":"tag","connectionCount":2},{"id":"cultural_formation","label":"cultural formation","node_type":"tag","connectionCount":1},{"id":"perception","label":"perception","node_type":"tag","connectionCount":2},{"id":"subjective_reality","label":"subjective reality","node_type":"tag","connectionCount":2},{"id":"body_representation","label":"body representation","node_type":"tag","connectionCount":1},{"id":"user_experience","label":"user experience","node_type":"tag","connectionCount":1},{"id":"haptic_feedback","label":"haptic feedback","node_type":"tag","connectionCount":1},{"id":"interaction_design","label":"interaction design","node_type":"tag","connectionCount":2},{"id":"reading_habits","label":"reading habits","node_type":"tag","connectionCount":1},{"id":"literary_expansion","label":"literary expansion","node_type":"tag","connectionCount":1},{"id":"personal_growth","label":"personal growth","node_type":"tag","connectionCount":1},{"id":"literature_value","label":"literature value","node_type":"tag","connectionCount":1},{"id":"book_interpretation","label":"book interpretation","node_type":"tag","connectionCount":1},{"id":"depth_of_content","label":"depth of content","node_type":"tag","connectionCount":1},{"id":"empathy","label":"empathy","node_type":"tag","connectionCount":1},{"id":"hope","label":"hope","node_type":"tag","connectionCount":1},{"id":"systemic_thinking","label":"systemic thinking","node_type":"tag","connectionCount":1},{"id":"culture","label":"culture","node_type":"tag","connectionCount":1}],"edges":[{"id":"entry_001__inner_conflict","source":"entry_001","target":"inner_conflict","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_001__creative_process","source":"entry_001","target":"creative_process","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_001__self_control","source":"entry_001","target":"self_control","relationship":"tagged","explanation":"","confidence":0.83},{"id":"entry_001__existential_doubt","source":"entry_001","target":"existential_doubt","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_002__creative_process","source":"entry_002","target":"creative_process","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_002__innovation","source":"entry_002","target":"innovation","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_002__inner_conflict","source":"entry_002","target":"inner_conflict","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_003__social_roles","source":"entry_003","target":"social_roles","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_003__culture","source":"entry_003","target":"culture","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_004__inner_conf ce":"entry_010","target":"interaction_design","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_011__interaction_design","source":"entry_011","target":"interaction_design","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_012__reading_habits","source":"entry_012","target":"reading_habits","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_012__literary_expansion","source":"entry_012","target":"literary_expansion","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_012__personal_growth","source":"entry_012","target":"personal_growth","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_013__literature_value","source":"entry_013","target":"literature_value","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_013__book_interpretation","source":"entry_013","target":"book_interpretation","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_013__depth_of_content","source":"entry_013","target":"depth_of_content","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_014__empathy","source":"entry_014","target":"empathy","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_014__hope","source":"entry_014","target":"hope","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_015__social_roles","source":"entry_015","target":"social_roles","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_015__cultural_formation","source":"entry_015","target":"cultural_formation","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_015__systemic_thinking","source":"entry_015","target":"systemic_thinking","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_016__inner_conflict","source":"entry_016","target":"inner_conflict","relationship":"tagged","explanation":"","confidence":0.9},{"id":"entry_016__existential_doubt","source":"entry_016","target":"existential_doubt","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_016__self_control","source":"entry_016","target":"self_control","relationship":"tagged","explanation":"","confidence":0.8},{"id":"entry_017__inner_conflict","source":"entry_017","target":"inner_conflict","relationship":"tagged","explanation":"","confidence":0.85},{"id":"entry_017__creative_process","source":"entry_017","target":"creative_process","relationship":"tagged","explanation":"","confidence":0.8}],"themes":[{"id":"identity","name":"Identity & Self-Understanding","description":"Who I am, self-image, authenticity, personal growth"},{"id":"creativity","name":"Creativity & Expression","description":"Making things, artistic impulses, creative process"},{"id":"learning","name":"Learning & Curiosity","description":"Intellectual curiosity, reading, mental models, expertise"},{"id":"values","name":"Values & Meaning","description":"What matters, ethics, purpose, integrity"},{"id":"emotions","name":"Emotions & Inner Life","description":"Feelings, moods, internal experiences, emotional patterns"},{"id":"philosophy","name":"Philosophy & Big Questions","description":"Meaning, consciousness, existence, how the world works"},{"id":"observations","name":"Observations & World","description":"Noticing things in culture, society, technology, nature"},{"id":"culture","name":"Culture & Media","description":"Art, literature, shared narratives, cultural patterns"},{"id":"technology","name":"Technology & Systems","description":"Software, hardware, digital tools, technical systems"},{"id":"society","name":"Society & Institutions","description":"Social structures, norms, institutions, collective behavior"},{"id":"self_control","name":"Self Control","description":"Synthetic theme."},{"id":"self_understanding","name":"Self Understanding","description":"Synthetic theme."}],"themeClusters":[{"id":"identity","name":"Identity & Self-Understanding"},{"id":"creativity","name":"Creativity & Expression"},{"id":"learning","name":"Learning & Curiosity"},{"id":"values","name":"Values & Meaning"},{"id":"emotions","name":"Emotions & Inner Life"},{"id":"philosophy","name":"Philosophy & Big Questions"},{"id":"observations","name":"Observations & World"},{"id":"culture","name":"Culture & Media"},{"id":"technology","name":"Technology & Systems"},{"id":"society","name":"Society & Institutions"},{"id":"self_control","name":"Self Control"},{"id":"self_understanding","name":"Self Understanding"}],"sources":{"source_001":{"id":"source_001","title":"01/12/2020","created_at":"2026-06-28","raw_text":"I sat there, staring at the screen, a million little puzzles filling my head. I had to figure out why my http post request was sending out errors, I had to figure out how to order downloads over a network, and I had to look at what was causing tracking errors with my virtual reality headset. It was all on a list, and I had set deadlines for myself. All of it was so… dry. The only real obstacles in my path were time, my own fear of failure, and the allure of a thousand distractions.\r\n\r\nWhat is a dream?\r\n\r\nMy mind suddenly prompted. It was doing that a lot these days, like a small flashing signal in the back of mind warning me that there was some urgent existential oil change that needed attending to; that my mind was slowly turning into sludge from the accumulation of the everyday annoyances and vapid thoughts that were filtered through.\r\n\r\nI felt the stillness of the room again. The books on the bookshelves felt like a little bibliography of my life, gently reminding me of the times I had read them, the cracks along their spines creeping proof of the sleepiness nights that a smaller me had spent escaping to other worlds, knowing with a certainty that only innocence can give that everything was possible.\r\nI press my fingers against my eyes. It sometimes feels like the reward for having a dream is doubt and poor sleep. I feel the old arguments rise, slowly swirling in the background noise of my mind. Nietzche’s eternal recurrence, Sartre’s good faith, Camus’ absurd hero - defense mechanisms that I painstakingly put in place in my early twenties to ensure that I wouldn’t give up on the ideals of my late teens, almost chaining me in place.\r\n\r\nRemember the injustice. Remember the guy who got hooked on drugs after everyone abandoned him and telling you about his wonderful acid trip on a bike. Remember the girl who burned all her furniture. Remember the small town girl confiding in a panic to you over a keyboard about her abusive boyfriend. Remember th-\r\n\r\nFuck.\r\nWhat the hell am I doing.\r\n\r\nYou’re creating a virtual reality experience that forms a useful tool in the context of the metaverse that allows real time downloading of 3D model using a game engine from the web which-\r\n\r\nShut up.\r\n\r\nAnd this is tied to your long term goal of a user created world based on use and meaning as it frees even the least artistic to create a space like a sandbox to express their inner-\r\n\r\nShut up!\r\n\r\nAll practiced pitches. Weak pitches. Backed by hope and no figures. There’s another voice in the back of my head echoing the Pareto principle, (only 20 percent of effort is required to get 80 percent of the way there), that I’m missing something and that I should figure out what moves the needle so that I can better use my time. That I should know what the needle is by now. That I’m too slow and that I should be better at big picture thinking. That execution is everything.\r\n\r\nMy mind brutally beats my thoughts into submission, telling it that there’s no real choice but to sit down and finish at least this small project that I’ve set for myself.\r\nI remember my journal entries for the last few years, demanding action, constructing this weird prison around myself to try and leave me no choice but to keep acting, giving myself no choice in the matter. Some random snippet of something I read years ago flits across my mind, asking me how one can have self discipline if one is beating oneself into submission. Then am I the master or the slave? And how have I done so little?\r\n\r\nI dislike thinking. Because I know all the answers that my mind will give me already. I sigh and open my phone, scrolling through conversations, distractions. I haven’t been engaged in a long time. Not when I’m coding, not when I’m talking, not when I’m reading. My entire life feels like it’s being lived through a haze of introspection, my constantly scanning mind somehow blurring the thing that is my life.\r\n\r\n'But you seem so miserable'\r\n\r\nGinny. Or my memory of Ginny. An idealized girl that existed nowhere but in my mind for two warm sunny weeks in Wintertime California.\r\n\r\n'How will you help people when you yourself are so miserable?'\r\n\r\n401 error, authorization. I'm pretty sure I put in the write authorization information, but I know so little that that feeling is worth its weight in thought. I start googling.\r\nBut I'm not miserable. I think?\r\n"},"source_002":{"id":"source_002","title":"03/07/2024","created_at":"2026-06-28","raw_text":"I want to give people a chance to be ‘playful’. But also I want moments where vulnerability is needed. Some way to connect. Not TOO deep, but deep enough. One moment in time. But is it possible to ‘design’ this experience? Feels like I’m trying to make the deepest ice breaking activity ever lol.\r\n\r\n’Children of the sky’?\r\n\r\nTalking with runes would be too difficult, and I don’t have the time to make a game system like that.\r\n\r\nI need a ‘clever’ thing I can make as a weekend project.\r\nI need to create something new, that’s not been tried in XR. I keep saying that I’m one of the best in this field, but I want to prove this.\r\n\r\nThe other person gets to choose three messages to ‘save’ => I want the space to keep emptying, but I want it to keep the ‘essence’ of what has been said as time passes. How?\r\nThe ‘vibes’ should keep updating.\r\nWhat constitutes a ‘message’? => Don’t worry too much about the tech yet\r\n\r\nThis doesn’t feel ‘new’ enough. The impact should be front loaded. People should understand the ‘sell’ as fast as possible’\r\nAlthough a message suddenly being scrawled in front of them would be super cool anyway.\r\n\r\nI need to go deeper, not wider.\r\n\r\nI need to make it easier to ‘add’ the person as a friend. \r\n\r\nMake an app that would move ME. Not anyone else, just me.\r\n"},"source_003":{"id":"source_003","title":"03/08/2024","created_at":"2026-06-28","raw_text":"There must be a way that culture is created, even if it’s just between ten people.\r\nEspecially if I give groups of three and then one ‘king’. But this is introducing hierarchy already.\r\nBut this is also kind of how close range DPS, healder, tanker, long range DPS works in MMOs. As long as roles exist, mythology around these roles crystalize.\r\n\r\nI could give everyone the same abilities and just see what people gravitate towards.\r\n\r\nHowever, I don’t know what long term experiments in culture creation even looks like.\r\nIt would be good to read some stuff in this vein."},"source_004":{"id":"source_004","title":"04/14/2017","created_at":"2026-06-28","raw_text":"04/14/2017\r\nWhat happened on that Day?\r\n\r\n\tIt was daytime. It was a warm daytime with sunlight streaming in through glass doors that led out to the balcony and a brilliant Californian day. The fan beat overhead, almost silent, attempting to chase the heat away. I held a heavy book in my hands. It dealt with patricide and Russia, with faith and cynicism, jealousy and honor; my world. It was the world that I had always tried to understand a little more of using the conflicting nature of people shown to us through ageless classics.\r\n\tBut it was such a nice day outside. I had long forgotten how nice a warm day feels, what it was like to smile only because the sky was blue. The catalyst for this change was a few feet away tapping away at a keyboard, frowning at some probability problem that had to do with efficiently finding the maximum using some kind of random walk. Interesting, terribly complicated, and, according to her, a very fun problem to think about.\r\n\tMy mind drifted from the book to a conversation we had had yesterday. I wanted things to change, and I wanted somehow to change them. She replied that I was obviously miserable, that I was missing the entire point of being alive. I retorted with a bible parable, her with a story about seagulls. ‘I want to help’ was my stance. ‘But you aren’t free’ was her reply. Maybe that’s why I like reading Dostoevsky, I thought, because his characters seemed caged, angry.\r\nI shifted on the couch, curling into a more comfortable position. The sun sinking into evening… tempting me to close my eyes. My mind was hopelessly scattered now. We had talked about empathy and sympathy. To understand one person IS to sympathize with them! Was her declaration against my point that these were different. I explained that to understand doesn’t mean that you sympathize, because sympathy seems to imply some form of compassion. Yet we can hate ourselves, showing that even in extreme instances of empathy there can be a plausible absence of sympathy. Yes, okay, but why do you care? Because I want to know how we can properly sympathize with each other.  But why?! Because then no one would have to feel hopelessly isolated. Again her signature frown- she was thinking about it. It interested her. A compliment.\r\n\r\nMy mind kept wandering, always into the same person.\r\n\r\nShe was the most straightforward person that I had ever met.\r\n\r\nIt’s so easy to be healthy! You just have to know that you want it and then just do it! Was her take on exercise. ‘But what if I feel lazy?’ I ventured. Then you ARE lazy. It was a merciless response, but fair enough. I started jogging. There was also a laughably convoluted conversation about how cutting carbs would free me from being dictated by hunger, and enable me to pursue what trains of thought I’d want. So of course, I started eating salads. \r\n\r\nI wanted to know what living this straightforward life was like.\r\n\r\n\tI had been closing a chapter in my life. One written by wanting to be myself in a world that seemed perversely interested in finding ways to kick me down. Such a life, I realized, was defined by staying standing despite everything crushing you, which meant being defined by resilience and a lurking anger. When everything belittles you, anger can keep you up. Anger, idealism, or indifference. But I wasn’t being attacked any more. All my coping mechanisms were doing nothing, all my walls and mirrors protecting me from threats now only imagined, hemming me in. I felt empty, hopelessly weighed down by all these self-made structures that no one could understand. The driving force of anger had burned to nothing, leaving me cold. Why was I here? Who was to blame? I hated it all.\r\n\tWell if you don’t like it so much you don’t have to be alive you know! Just get a knife or something and ask if you really want to live, and you do, of course you do! Because you’re alive right?! A challenge that hung in the air, her outburst a little too passionate for the talk we were having. I gave an awkward smile, remembering. A knife, me. No cuts, no dramatic gestures, no plea for attention. Just me, a knife, and a question. The question. I had felt tired, so tired. I said so, her expression softened. We were both talking from experience.\r\n \tWe’re here because we want to be. She started. So stop being so damn miserable? I finished. She smiled. Yes. Exactly.\r\n\r\n“Arrrgh.”\r\nA frustrated grumble took me out of my dozy memories. I looked over at the small hunched figure with her head in her hands.\r\n“Having trouble?”\r\n“Yes, I’m sure I can figure it out. I just need time to... How’s your book?”\r\n“Interesting, just read a chapter called ‘The Inquisitor’. It’s about how… well… it’s complicated.”\r\n“Tell me.”\r\nI ambled over to the table, collecting my thoughts. Long shadows sprawled across the living room floor, the sun flaring orange for the final hour before it set. She was here for a few more days, then we’ll never see each other again. That was fine. I would miss her, but that was fine as well. We would trade presents, and say our goodbyes, and that was how life flowed by, how people passed by. But today I looked out at a beautiful day and appreciated the sun’s warmth, looked up into a clear sky and smiled at its clarity. It had been a fine day.\r\n"},"source_005":{"id":"source_005","title":"04/16/2018","created_at":"2026-06-28","raw_text":"04/16/2018\r\n\r\n\tI dislike how my days are going. I’m letting them flow past me without much care. Everyday used to mean so much more to me. It seems to have something to do with attention and want. When one wants something you measure the time pass by one tick at a time, clinging to any sign that the last second, the last minute had left some mark on your mind. Then one gets to the worrisome business of measuring the time left, thinking that maybe if the last minute had left this much then the next minute should leave a little bit more. But when indifference settles, it settles like dust. Filling the grooves of effort painfully etched with the minutes, dulling their edges, softening their corners, until what industry was in the air is now just a shimmer of a million dust particles that swirl in the sunlight. All is slow and time quite immeasurable so that the seconds fade into minutes, and the minutes somehow to days. At first it seems like rest from all the wearisome measuring, but one soon realizes- It is decay.\r\n\tSo then what does it mean to want for something? Is it the restless nights that just seem to happen as you grind yourself down in the search of a goal? Our ideas about progress seems to have influenced how we conceive ourselves in time. Definitely, my readings of existentialism influenced how I see myself in relations to ideas such as fate. There is no divinity that guides my hand, and so I am utterly alone. Once I understand this, then I am responsible for all my actions. This is what I’ve always thought. But to be responsible does not mean that I am the sole arbiter of the world, it only means that I can only do what I can. So then it becomes a problem of what I want. How does a person ever know what they want?\r\n\tThere must be a difference between saying ‘I should do something’ and ‘I will do something’.\r\n\tHowever, I can’t keep saying ‘after I do this one thing I’ll live my life’, my life is now, and all of the time I’ll ever receive is already going by, ceaselessly, until I die. Life is now. Life is here. So then what am I doing with all of this life that I’ve gotten? Is it what I want? I don’t think so.\r\n\tI will delve deeper into the things I care about: neuroscience, virtual reality, and empathy. I need to constantly hold myself accountable to live within these lines. I am just like all other people, there is nothing special about me. So I must make myself chase the things I want. Write about it, read about it, work on it, meet people who are in it. There are ceaseless opinions and essays on these very topics that I profess myself to be enraptured by. There is no excuse for laziness.\r\n"},"source_006":{"id":"source_006","title":"04/21/2014","created_at":"2026-06-28","raw_text":"Myself and the world\r\n\r\nThe idea exists to be expressed. The thought is the why and what of what we do.\r\n\r\nIt's an odd way to start off a concept, but I mean that the existence of ideas means the existence of the person. The person is defined by what they think and why they think it. Negatives, positives, empathy, cruelty, faith, disbelief; they're all rooted in thought.\r\n\r\nAs an extension of this thought, it would be fair to think that the idea is the world. The world is defined by what we think regardless of how the world itself is arranged. The world is indifferent, we just shape it to be cruel or kind. Mind over matter.\r\n\r\nThe thought leads onto the very basic concept that everyone lives in their own world, completely different from the world of others. Every mind is a world for the world is in the eyes of the beholder.\r\n\r\nDoesn't this worry you sometimes? What if that one person you thought was nice to you actually just thought nothing of you? What if those who you thought were significant in your life held you in no significance at all?\r\nAlso, on brighter notes, what if people you just passed by everyday perceived so much more beauty in the everyday than you ever did. It could very well be that the stony faced person whom you ridiculed for being one of the herd actually ponders questions that would befuddle you even with the very basic openings of its argument.\r\n\r\nThe world is acting on you, but at the same time you are acting on the world. You cannot simply be a victim to any whim of fate. A victim of fate is one who resolutely chooses to fall, not one who accepts the fall.\r\nThe fall itself is avoidable, but will most probably come with a life of mere existence.\r\n\r\nThe master of the world is you. To complain has no meaning in such a world. To believe is to make possible. To act is everything. Boldness is magic.\r\n"},"source_007":{"id":"source_007","title":"04/21/2017","created_at":"2026-06-28","raw_text":"Why bother?\r\n\r\n\tAh, hello old friend. I hope it’s fair to call a question a friend, since friendship is really only a matter of intimacy. I wonder if there has been a single day in the past decade where you have not taken up at least some corner of my thoughts. Such an incessant friend, so needy, and unrelenting. We’ve been down many paths trying to satiate your need to be answered, your need to be truly understood and satisfied. As is the case with old friends, I feel that I’ve perhaps adopted too many of your mannerisms and your mode of thinking. I’ve spent entire days pondering what you mean. I’ve even let you creep into conversations with my other friends, and the need for an answer grows only stronger with every failure.\r\n\tI first really made an acquaintance in the very early years. You make yourself known best when there is something making me do things I do not want to: when there are tests I don’t care about, when I have to perform actions I have no real investment in, and when I find effort to be just too much at certain points in time. So I would get to know you through the times when I was in my room, trying to live the dreams of other people, making myself act stronger than I felt.\r\n\tAs I grew older I’ve found that you have a lot of friends, lots of people you bothered with your presence. One frenchman even said “There is only one really serious philosophical question, and that is suicide.” Boy you really drove that man up the wall. Remember that time when I thought that life was about what you can leave behind? About the people who will pick up your dreams and keep whatever fire you lit burning towards the ends of eternity? I really did read too much fantasy back in the day. There was also a short stint where I thought life was about being nice to other people and trying to understand them. That was really the bible talking, but it really helped me question morality in interesting ways later down the line. So I guess I salvaged something out of that mess. I had a stage where I thought life was about hope, and about breaking apart everything to grab only whatever happiness I could. I think I was sad then, and your constant questioning of my life choices made me selfish and very angry. It didn’t help that around about this time we thought that life might be about trying to help the people we care about. Figuring out that those same people can hurt you in ways we thought I was already guarded against wasn’t much fun, especially when it happened a few more times. Well, fool me twice I guess.\r\n"},"source_008":{"id":"source_008","title":"04/23/2014","created_at":"2026-06-28","raw_text":"Myself and I\r\n\r\nIdentity, the greatest lie of all. How can I see me from outside myself, when trying to get out leads me back to myself. To try and look at yourself is trying to escape the mobius strip by walking along it. Identity is an infinite trap.\r\nI know myself better than I know anybody, and the infinite alleys and curtains that branch and veil. I am afraid of the dark paths, that is why I have drawn curtains over them.\r\n\r\nYet who but I can call myself by my own highest name? Who else can tread along these winding roads that split and crack and still comfortably call it home?\r\n\r\nThere are temples here, some broken down, some almost forgotten, all once revered. There are books and books and books strewn about.. on life, on love, on happiness. Scraps of paper desperately torn out after being scribbled on. They were all in search of an answer to a question I don’t know how to say.\r\n\r\nI love and hate myself, as I love and hate this world.\r\nThis world so full of pain and wonder. Where the glimmering light sometimes refracts into ten thousand thousand shards of light in an instant of purest understanding. This place where it always feels like the tide is rising and I will always drown.\r\n\r\nWhen I act I act upon the world, when the world acts it acts upon me. But here is where I am both world and myself. The quiet tides of this place are tides I have made, the storms, storms I have accepted.\r\n\r\nHere I am. Here I always will be.\r\n"},"source_009":{"id":"source_009","title":"05/03/2018","created_at":"2026-06-28","raw_text":"\tIt’s almost been a year. I think it’s odd that we mark the passage of time so much when time itself seems like a continuous concept that keeps flowing on. It feels a little like seeing a river and trying to put marks in the water. But maybe we do this because time feels like it’s tied to our sense of self, as time is tied to our ideas of change. Identity is a tricky thing to define, and so we look at makers- the days, the weeks, the years- in an attempt to grasp at what feels ungraspable.\r\n\tI hold little belief in the illusion that you would care about me at all. There are undercurrents of my past in this belief, as people seem to have a knack of not caring about me. But that itself is also a delusion, and I feel that the truth is that people have little time to spare about others who are not central to their lives. To be able to remove the personal feelings out of the equation and try to rationally see the whole picture is also a sign that a person has grown. It’s just another one of the markers we use to try and find ourselves, to define our growth and change.\r\n\tSo…. time, change, and growth. I guess you can see where this loosely sewn together bit is going. How have you grown, and how have you changed? Are you happier than you were last year? Have you managed to find out if the path you’re pursuing is the one that you’ve always wanted? Are you certain of the meaning that it brings to you life? I ask this because these are the questions that I think are important, and because you seemed rather lost the last time we actually talked. Everyone who talks and opens up to me feels just like that- lost. When they find their way I become less valuable, more disposable. But trying to help people find their way, and catching people before they fall off cliffs, I still believe that there’s value in that.\r\n\tPart of me hopes that you are still lost because maybe then there would be something to talk about, something both of us can relate to. But my bigger hope is that you’ve found what you’ve wanted. I believe that you’re a good person, and it’s my hope that you have more than just the run of the mill thoughts. It has always been my wish that people like that could dodge the hardships of both society and existence to grasp at what is beyond the struggle- that thing I like to think of as meaning. If so, would it be possible to tell me what it’s like there?\r\n\tProbably nothing special. I know that somewhere in the back of my mind I think that people are not yet capable of even understanding what it means to be alive. Because we’re all so small, and we understand only fragments of the world, and whatever meaning is probably encased in the worldview that you have made for yourself. Such meaning is useless as a reference point for anyone else, and hearing your answer without first putting the effort to understand your worldview would make it sound like nonsense. I do not have the perspective to appreciate your answer, and it’s entirely my fault. After all, it was me who decided to raze even whatever hope we had to building a bridge between us. But I was tired of hurt, and I’d seen that pattern before. Sorry if I was a bit extreme. I wanted the cut, when it eventually happened, to be absolute. My rather horrifying approach was the only way I could think of achieving it, as the cut I wanted was a little different from the stereotypical ‘clean cut’ that people usually refer to. I hope that my actions did not make you jaded in any way. That I am most worried of.\r\n"},"source_010":{"id":"source_010","title":"07/03/2018","created_at":"2026-06-28","raw_text":"What do I want?\r\n\r\n\tWhat do I want? Well ultimately, I think I want what we all want. I want to be happy. But this is no answer at all.  Perhaps I should move onto a more personal account of happiness. I think that the man who both works at something he believes in and has his work understood is closer to happiness. \r\nThis is still too abstract. Maybe an example might help. \r\n\r\nImagine a time before art where a person stumbled upon a brick, a crumbling brick in the morning sun surrounded by some slight mold and grass in some corner of the garden. They decided this moment, the most important moment in their life and started about capturing it. But there is no art, bricks were drawn as wonky squares.\r\nThis seemed good enough. But this person found that straighter lines would make it seems a little more regular and ‘brick-like’. Which seemed understandable to other people. There is something inherently satisfying about good right angles and clean lines.\r\nBut then the person finds this deeply unsatisfying and happens upon that fact that two elongated rectangles on the side makes it seem more… three dimensional somehow.\r\nNow this guy is a nutjob. While what he found may seem true to some people he cares about bricks way too much. But there is more. They find out about shading, then about how there seems to be a line of light on the edge of the darkest edges (as light does ‘bend’ around corners, but how were they to know?). How it is wrong to even draw the outline and to let the colors dictate where a shape starts and ends. One day as he is doing this someone will stop him and say ‘that’s not quite how a brick looks’. It is in this moment that the gap has been closed. Others can now see parts of what the person was trying to create. Their dream, while maybe not quite realized, can finally be shared. One day they might get to show the tranquility of the rough red brick, slightly worn, that was surrounded by soft hues of green and splashed with color from the butterflies and flowers. There is something attractive in this idea. To be able to work on what one loves and finally have people see what is it that one loves about it. \r\n\tNaturally then, the next piece of writing will be the question ‘what is it that I love?’. \r\n"},"source_011":{"id":"source_011","title":"08/03/2019","created_at":"2026-06-28","raw_text":"This tribute I write for the child who tried as hard as he could to change a situation that he was powerless to change. He hadn’t still understood that his heart was even frailer than his small body, and so he beat it against rocks. He was one full of laughter, and embarrassingly sensitive; one who wanted to cry at the small injustices. He thought that if he tried as hard as he could, he could change everything around him. After all, why shouldn’t he be able to? Everything he had read, everybody that he had talked to, they all seemed to affirm the belief that his words should matter to someone. If there was anyone that his words should matter to it was his family. So he gave up all the small pleasures. Pleasures like being able to go outside whenever he wanted, to dawdle a little after school to talk to his classmates, and the pleasure to read uninterrupted on his bed as he fell deeper and deeper into books.\r\nHe felt he was worth something. That was his mistake, or at least that’s what was incompatible with his surroundings. Especially after the move, everything was horrible. Every single day upon crossing the doorway he was in fight-or-flight. Every small conversation could stray into an argument. Arguments that were so one sided, where his voice wasn’t heard. But his voice SHOULD be heard. He had read enough, had thought enough, and he thought that he’d seen quite a bit too. But at least it should be enough to explain, just to explain what he was thinking when he had said a sentence, or why he didn’t like taking constant orders. But orders were to be obeyed, and anyway something had annoyed her a little today, and the rules were even tighter than usual. The boy, the boy, the boy he just wanted to be heard. His anger boiling over to rage. Coming up with stupid systems where maybe he could talk and then she could talk, and they could eventually come to some understanding. Some way forward. But no. No. It was always ‘why can’t you’, ‘why aren’t you more like’, ‘you shitty brat’, ‘is it because you’re so dumb you can’t’, ‘we sacrifice so much’, ‘I hope you have kids like you one day that destroy your life’… If only he could TALK. If only he could be heard in this hellhole of a place.\r\nWell he had a little sister who was afraid and hurt too. So he wanted to keep laughing and smiling. But the rage just kept building. He was hard done by. He was certain. If he wasn’t hard done by, none of this made any sense. Why one earth was he so alone. Why did no one listen? Who does he turn to when times get rough? When, oh god, does he get to sit down and feel sorry about himself and have a good cry?\r\n"},"source_012":{"id":"source_012","title":"10/07/2021","created_at":"2026-06-28","raw_text":" Hey VR peeps, I'm just posting this to share some general insights into VR I've had over the years. Feels like it could be useful for people who are actually thinking with some more depth about VR. I just miss these kinds of convos I guess. If anybody has any leads to where I can find these kinds of communities lmk!\r\n\r\nWell the tl;dr is that by actually only tracking our head and hands, a bunch of really weird things happens to how we can think about our bodies and how we use them to interact with the environment in VR.\r\n\r\n----------------------------\r\n\r\nCommercial VR sets today come with a head mounted display (HMD) and two controllers. Usually for reasons of presence, VR experiences give us some kind of body. But these bodies aren’t real, and are usually rigged with some kind of inverse kinematics (IK). For those who don’t know, inverse kinematics is just taking a bunch of joints and figuring out where they are based on where some other joints are, and constraints on how much the joints can bend. In VR that means that the software takes the position of your head and hands and then fits the whole body depending on those, knowing basic stuff like your elbows shouldn’t bend outwards. This is why in VR you sometimes get your avatar’s elbows sticking out to your sides, the program is just guessing wrong.\r\n\r\nBut what all this means is that your body isn’t really there, what’s actually there is just your head and your hands. But it’s not really your had and your hands, they’re just anchor points that give a reference of position as to roughly where your head and hands are.\r\n\r\nWhy is this important?\r\n\r\nWell, for different reasons. In VR, your head is usually used as a point of reference as to where your character’s location actually is. This can lead to some oddly tricky situations where you’re peeking over a cliff or around a corner, but your whole body is moved.\r\n\r\nThe game engine can’t really tell the difference between these as long as only the head and hands are tracked. The illustrations above make this problem more obvious (while also showing you how bad I draw).\r\n\r\nBut it should be pretty obvious now that VR avatars, as they are set up right now, aren’t the best at finicky poses. This makes genres such as stealth, much more difficult than one would like. As actions such as sticking to walls and peeking around corners aren’t guaranteed to work.\r\n\r\nIn general, this means that inputs (with inputs here being the literal positioning of your body) might not work the way that players want them to. And we all know that games mis-inputting commands is extremely frustrating. Since we want the player to feel like they have control over their own body at all times, this is an important design constraint.\r\n\r\nThe problem of precise movement gets even worse with hands.\r\n\r\nIn real life, we actually require extremely precise movements from our hands very frequently. We also rely on a bunch of different stimuli to perform tasks involving our hands successfully. Even for things we really don’t think are that complicated.\r\n\r\nFor example, when we pick up a cup full of water we first need to feel the cup on our skin. The tactile feeling of the cup on our skin, as well as the resistance that the weight of the cup gives gives us precise signals as to how to move to envelop the cup with our palm and fingers without toppling it over or pushing it away. The resistance offered by the shape of the cup itself helps us to know when to stop closing our fingers. If we didn’t have these signals we would either just keep constricting our grip until the glass shatters in our hand, or we would grab too loosely and drop the cup when we tried to pick it up. Then when we pick the cup up, the combined weight of the cup and its contents helps us know just how much strength to put in to lifting the cup. The shifting center of weight helps us to keep angling the cup as we lift it so as to avoid spilling its contents. This lack of weight and acceleration of objects is also why throwing objects in VR usually feels terrible.\r\n\r\nAll of this is just not possible with the current control scheme in VR. Even with hand tracking there is no tactile feedback or resistance offered by objects. While there are people working on this, I’ll stick to what we got for this discussion.\r\n\r\nSo as I said, grabbing objects is hard. Any number of movements that require precise movements is hard. If we look at the grabbing portion of the cup example above, what happens looks something like this.\r\n\r\nBut this is obviously impossible with the control scheme that we have in VR right now. What happens in VR when we grab objects is pretty much this.\r\n\r\nOur hands actually aren’t hands. They’re too limited. The hands are actually an illusion, and it’s easier to think of them as spheres with button inputs to perform specific actions.\r\n\r\nPeople have come up with various clever ways of using the oculus controllers to do various things. One basic way is thinking about the oculus controller as a handle for whatever virtual object that you’re using. This has been used for swords and guns a lot. Like a LOT. Also ping pong paddles a surprising amount of times.\r\n\r\nThe lightsaber, gun, and ping pong paddle are also great objects to be holding because they require much less feedback. For example, a real sword would make you expect a pretty big torque force from the blade to your handle, but you would only expect a light vibration from the lightsaber as you’d expect it to just cut through things with ease. The gun is also an object that can kind of make do with vibrations from the controller for kickback, and ping pong balls are not really known for their massive weight. Bow and arrow is also a popular object in VR for similar reasons.\r\n\r\nOne other very early thing that people figured out was using a type of ‘laser’ that came out from the front of the controller. This was used to select objects far away, and is pretty much a gun again. Tilt Brush also uses the point just in front of the controller to draw with, like the tip of your pen. Kind of like a very very short laser if you think about it.\r\n\r\nVR does try to use the hand mesh/object itself to act as more than just spherical blobs in space and tries to introduce more natural hand movements and inputs in some pretty cool ways.\r\n\r\nThe Oculus Touch uses capacitive sensors on its buttons to tell if the person has their hands on the buttons, which then translates to various hand… postures(?). Is there a word for that? Gestures?\r\n\r\nAnyway, these can then be used for some more natural gestures. Like, I’m pretty sure everyone has done finger guns and thumbs up in VR. I’ll show some of the most used possible hand gestures below. The pic is a bit old, but the ideas have stayed pretty much the same.\r\n\r\nYou can actually use these as distinct inputs, such as the thumbs up triggering a like. There is also a pretty neat use-case in Neos VR where a game lets you make a frame with your thumbs and index fingers to take a picture.\r\n\r\nThe Valve Index controllers go a little bit further than the oculus controllers, in that it just has a strip on the part of the controller that you grab that can sense if your fingers are on it or not. Also, it can sense if you’re actually grabbing an object as opposed to just having your fingers down.\r\n\r\nI feel that this is a somewhat better solution than the Oculus Quest’s solution of simply including finger tracking. This is because while hand tracking does feasibly give us better accuracy, the accuracy is wasted because we can’t really do anything that requires that much accuracy because of the whole ‘lack of tactile feedback and resistance’ thing that I mentioned in the cup example. Imagine trying to button a shirt without the buttons pushing back at you. That might actually be a new level of hell.\r\n\r\nThe Valve Index controllers also have the advantage of being able to actually grab your controller when you grab objects. This helps with immersion when you’re grabbing your sword/gun/ping pong paddle, as opposed to just grabbing thin air.\r\n\r\nOf course, there are probably use cases where the hand tracking is more useful than the Valve Index controllers, but I haven’t quite seen much yet. You could argue for specific hand gestures for specific inputs, but that sounds like a huge headache to figure out when to accept the inputs. Also, making sure of the inputs probably puts you in around the same ballpark as what you would have been able to achieve with the Valve Index controllers anyway.\r\n\r\nOf course, the hand mesh itself can still be used in VR. We can use the hand object to push buttons, and it’s a pretty common thing to use your index fingers to press a button. However, the problem still stands that we can’t track minute movements with much reliability, and that button inputs in real life rely on the object’s ability to push back. For example, imagine if your fingers simply phased through your keyboard. You wouldn’t be able to have your fingers slide along your keys as you typed, you would have to manually stop your fingers as opposed to pushing down and letting the keyboard itself just hold them, and you wouldn’t be able to rest your hands on the keyboard or table itself.\r\n\r\nAll of this translates to huge buttons in VR to compensate.\r\n\r\nOf course, there are ways to bring your keyboard with you into the virtual environment now, but for the most part this is what people are dealing with.\r\n\r\nThe other way of interacting with the virtual environment is motion controls. Motion controls are actually much more common than you think. This is because the act of swinging a sword, aiming your gun, pulling back a bowstring, throwing an object, etc are all motion controls. People just kind of don’t really think of these as motion controls because these are extremely natural. This is kind of what part of the magic of virtual reality is, and a huge part of the immersive experience.\r\n\r\nIn my head, there are two other types of motion controls other than the purely natural ones. The first is motion controls that are kind of natural, but ones we wouldn’t really do in real life. I’m talking about things such as flapping your arms to fly, or using your arms to walk, swinging with grappling hooks, etc. These are all in virtual reality in games such as Birdly, Gorilla Tag, and Windlands respectively, and they allow us to intuite natural movements that we usually wouldn’t have any reason to execute.\r\n\r\nThe third type of motion control is the one that most people would think of when talking about motion controls. This is the one where you perform strange arbitrary actions to make things happen.\r\n\r\nOne game that does this pretty well is Waltz of the Wizard : Natural Magic. This article from the Road to VR explains it best. I’ll quote from it.\r\n\r\n“You can blast out the particles from both hands to get the most destructive shot—simply pull your palms towards you while grabbing to ‘gather’ magical particles and then release to shoot them out. If you toss them out with a quick motion, they’re powerful and compact. Toss them out slowly, and the particles gently leave your hands and spread apart for a wider area of effect… Those particles can be guided in mid-air by holding the trigger again and moving your hand; you can move around corners, chase flying enemies, and navigate your shot through tight spaces like windows… By slowing down and directing your shot mid-flight, you can also cover baddies with particles and telekinetically control them”.\r\n\r\nAll of this is really, really cool. But they’re also contrived. You’re literally creating a new language in VR that’s absolutely native to the experience. Another VR game that’s playing around with the idea in a cool way is Rumble, which is trying to recreate something akin to earth bending from the Avatar series.\r\n\r\nThis type of interaction, when done well, can push forward what is possible for us as human beings. It adds new grammar to what we can do with our bodies.\r\n\r\nFor the last part of this I want to actually look at the bodies that we actually have.\r\n\r\nIn VR, as I’ve said before, we only have our heads and our hands. We can’t really fully ignore the fact that we have legs, they take somewhat of a backseat to what we do usually have in VR. The actual body that you have in VR usually feels a little like this.\r\n\r\n Where are our feet and elbows?! (long post)\r\n\r\nWell you don’t quite feel electricity flowing through your arms. But it’s more like your head and your arms are tentatively linked to your center chest area. Everything else, the game engine can get wrong (as I showed in the first drawing with your elbows sticking out). I tried to show this rather shifty nature of the position of your arms with lightning.\r\n\r\nNothing really properly exists below that chest point in VR unless you buy extra trackers. There are some cases where you need to squat down where this action does afford you some more presence, but that’s just your real body compensating for what virtual reality can’t do. Your body plus the movement of your camera is sometimes enough to trick you.\r\n\r\nSo now it becomes more obvious why facebook decided to just lop off your legs in Facebook Horizons.\r\n\r\nBig name VR experiences such as Rec Room and Orbus actually take it one step further and do away with your arms entirely.\r\n\r\nThis is pretty interesting when we’re trying to approximate being a person in-game. But that’s a top-down approach. In other words, we want to be human and then we work with what we got.\r\n\r\nWhat if we worked the other way? The bottom-up approach here would be to take what we got and then see what we can do with this. I believe that this could lead to more intuitive and natural interactions in VR. For instance, I mentioned Gorilla Tag earlier. Gorilla Tag is a hilarious game where the basic premise is ‘what if your arms WERE your legs?’, and then you run away or chase other gorillas by swinging your arms back and forth like a gorilla. You can even climb up things by grabbing them, fully making locomotion only hand based. Which is extremely natural and intuitive.\r\n\r\nThis kind of leveraging of what VR offers and then recontextualizing it into a situation that works might be a more fun avenue to go down than just trying to make human avatars with what we have. Any in-game character that only has a head, torso, and two hands can work.\r\n\r\nThis is a first pass look at user input in VR, it’s shortcomings, and some ways it’s been played with by developers.\r\n\r\nOf course full body tracking gets rid of a lot of these insights, but it's just a note on what's been happening up until this point. Also, feel free to just hmu for a chat or comment on whatever. I just love VR lol"},"source_013":{"id":"source_013","title":"10/08/2018","created_at":"2026-06-28","raw_text":" I'm not a frequenter of this subreddit, but I just saw the ' People who look down on someone who read for entertainment.' thread on the front page, and found it somewhat unsettling. I hope I'm not beating a dead horse by making this post. I would also hope that I'm not assuming too much by voicing my opinion, but I'm afraid that that ship has probably sailed AND sunk in some spectacular fashion. But I want to give my story.\r\n\r\nI want to start off by saying that I was an avid reader during my adolescent years, and I completely understand the joys of reading for nothing but pleasure. I started off, as many have, with Harry Potter. I read LotR, some disc world, lots of Roald Dahl, Enid Blyton (I grew up in the UK during my early reading years), Time Twister, lots of Garth Nix, Dragonlance, Dan Brown blah blah blah. I've even read the Twilight series, Divergent series, and other YA stuff even when I was in my later teens. I read historical fiction books like Emperor (Julius Ceasar) and a series on Genghis Khan. From 11-13 I think I was reading at least a hundred books a year. That slowed down due to a move to Korea and a focus on studies. The books I have listed are what I can remember off the top of my head, and are by no means exhaustive. So I really, REALLY get what it feels like to read for fun.\r\n\r\nBut I remember one day when I tried to get some other book (I think it was 'The Fall of Gondolin' since I love Tolkien), and my dad just looked at me and said \"This is fine, but you should think about broadening your horizons a bit\". He still let me get it of course, and it was great fun reading about the Battle of Unnumbered Tears after only having fleetingly read about it in the Silmarillion. But his words kinda stuck with me.\r\n\r\nSo I tried my hand at the classics. I'd completed some stuff from Charlotte Bronte and Dickens before, but honestly they were too hard for me at the time. This is what dissuaded me from classics for a looooong time. Since I got the idea that they were a tad stuffy, and didn't really GO anywhere. But since my dad had nudged me a bit, and since I trusted him I tried my hand at 'A Christmas Carol'. It was kinda great, and that surprised me.\r\n\r\nAfter I closed the book, I remembered an argument I heard my parents having back when I was reading all those books at 12-ish. My mother was a classic tiger asian mum, and wanted me to read harder books (and thus the first poke into classics). My dad didn't like this idea and said it could turn me off reading, that there was an age to these kind of things. At the time I didn't care too much about what was being argued over, and I was just happy that I got to keep reading about Australian time guardians who were prophesied to become gods. The only lasting influence it had on me at that time was that it felt odd that books would have an 'age' to read them at. Since weren't all books a great romp? How could someone read a book and not GET it?\r\n\r\nThat question got answered after I read 'A Christmas Carol'. These questions about morality and greed seemed to make more sense to me than when I read it when I was younger. Then I read Oliver Twist, and the plight of a child much like me trying to keep it together in a hostile and confounding environment while horrible things happened was also oddly relatable. Lord of the Flies was great since I was at that edgy time where I looked around and through that everyone was a monster and this book was totally like 'yeah, totes, beelzebub'. I got into Shakespeare and I loved 'Julius Caesar' and the sheer drama of it all. I absolutely ADORED Hamlet, since that indecision about life is exactly what I was feeling as I geared up for college. 'The Stranger' made me understand that crazy disconnect i felt with a world that seemed to want me to conform to its social norms. When I opened Harry Potter again, it was there, like an old friend. But it was a friend I'd long since outgrown. The themes of friendship and perseverance were still there, but it was now so naive and innocent. It was a book that I would love my kids to read as they tentatively step into literature.\r\n\r\nBut as I kept reading I felt that there were only so many fantasy romps you could read before feeling like there were only so many variants of the same tropes that you could take (The Belgariad anyone?), and that I was just reading the same tweaks of stories over and over and over again. There's nothing wrong with this, it's the same as bingeing shows like Parks and Rec or Merlin on TV. But after a while it's just that, bingeing. If that's all you want from books,
